rid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 20px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Discovery &amp; blueprint<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 10px;\">\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Current-state evaluation → gap analysis<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Strategic prioritisation → prioritised use-case list for the first module<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0;\">AI-first solutioning → platform architecture and project plan<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 20px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Build &amp; deployment<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 10px;\">\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Core AI services → select modules per the prioritised list<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Priority use-case rollout and API orchestration → remaining modules<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0;\">Performance validation and national-scale testing → GTM scale-up<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 20px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Stabilisation &amp; adoption<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 10px;\">\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Continuous monitoring and optimisation → GTM scale-up and fine-tuning<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Adoption support for ministries and states → SOPs, ops manuals<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0;\">Governance compliance and validation audits → audit report<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 20px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Handover &amp; transition<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 10px;\">\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Knowledge transfer and institutional capability building → documentation, KT plan<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Full transfer of codebase, infrastructure and governance ownership<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0;\">Transition to sustainable in-house management by Karmayogi Bharat<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Effort, team &amp; commercials<\u002Fh2>\n      <p style=\"font: 400 15px/1.7 'Instrument Sans', sans-serif; color: #4A5665; margin: 14px 0 0; max-width: 820px;\">Effort and commercials are a Phase 0 deliverable: the technical and commercial proposal covering both tracks, with technical advisory input from COSS. Final scope, timelines and payment terms are finalised in Phase 0. The placeholders below are reserved for those numbers.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin: 20px 0 0;\">\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 22px 20px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Track A effort<\u002Fdiv>\n          <div style=\"font: 300 34px/1 Spectral, Georgia, serif; color: #C4AF8C; margin-top: 14px;\">—<\u002Fdiv>\n          <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #7A6A4E; margin-top: 10px;\">Person-months for the Sunbird upgrade, to be sized after the current-state assessment<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 22px 20px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Track B effort<\u002Fdiv>\n          <div style=\"font: 300 34px/1 Spectral, Georgia, serif; color: #C4AF8C; margin-top: 14px;\">—<\u002Fdiv>\n          <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #7A6A4E; margin-top: 10px;\">Person-months for the AI platform, to be sized against the prioritised use-case list<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 22px 20px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Core team<\u002Fdiv>\n          <div style=\"font: 300 34px/1 Spectral, Georgia, serif; color: #C4AF8C; margin-top: 14px;\">—<\u002Fdiv>\n          <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #7A6A4E; margin-top: 10px;\">Composition across PMO, architecture, engineering, data, AI, QA and design; includes a full-time Project Manager<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 22px 20px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Commercials<\u002Fdiv>\n          <div style=\"font: 300 34px/1 Spectral, Georgia, serif; color: #C4AF8C; margin-top: 14px;\">—<\u002Fdiv>\n          <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #7A6A4E; margin-top: 10px;\">Milestone-linked payment terms, plus infrastructure and AI-inference cost model<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 11 · DEPENDENCIES, RISKS & GOVERNANCE -->\n    <sc-if value=\"{{ s11 }}\">\n    <article data-screen-label=\"11 Dependencies Risks and Governance\" style=\"max-width: 1020px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 11<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">Dependencies, Risks &amp; Governance<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">Tarento front-ends delivery for both tracks and is the single point of contractual and delivery accountability to Karmayogi Bharat. Three governance bodies sit above the work.<\u002Fp>\n\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 44px 0 0;\">Governance structure<\u002Fh2>\n      <div data-om-raster=\"\" style=\"margin: 18px 0 0;\">\n        <div style=\"background: #12233D; padding: 20px 24px; text-align: center;\">\n          <div style=\"font: 500 19px/1.2 Spectral, Georgia, serif; color: #FFFFFF;\">CEO, Karmayogi Bharat<\u002Fdiv>\n          <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #9DB2CD; margin-top: 6px;\">Executive leadership, strategic direction and overarching governance oversight. Chairs the Steering Committee and conducts regular reviews.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: #E2DED6; border: 1px solid #E2DED6; border-top: 0;\">\n          <div style=\"background: #FFFFFF; padding: 20px 22px;\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px;\">\n              <div style=\"font: 500 17px/1.25 Spectral, Georgia, serif; color: #14202E;\">Project Management Team<\u002Fdiv>\n              <span style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #12233D; background: #C9B68B; padding: 6px 8px; white-space: nowrap;\">Weekly<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 11px 0 0;\">A full-time Project Manager from Tarento, key persons from KB and DoPT coordinated by PMC, and invited officials. Tarento handles operations — weekly statuses, minutes, and weekly, monthly and project plans.<\u002Fp>\n            <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785; margin-top: 14px;\">Standing agenda<\u002Fdiv>\n            <div style=\"font: 400 13px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Project progress · issues and concerns · performance and SLA compliance · escalated issues · proposed changes · risks and mitigation · timelines and anticipated delays · IT infrastructure procurement · deployment status<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #FFFFFF; padding: 20px 22px;\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px;\">\n              <div style=\"font: 500 17px/1.25 Spectral, Georgia, serif; color: #14202E;\">Steering Committee<\u002Fdiv>\n              <span style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #12233D; background: #C9B68B; padding: 6px 8px; white-space: nowrap;\">Fortnightly<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 11px 0 0;\">Senior stakeholders from KB and its nominated agencies and Tarento, chaired by the CEO, KB. COSS may be invited in an advisory capacity. KB may call additional meetings with prior notice.<\u002Fp>\n            <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785; margin-top: 14px;\">Purpose<\u002Fdiv>\n            <div style=\"font: 400 13px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Reviews project progress, risk parameters, resource deployment and plan, immediate tasks and obstacles. The forum for seeking approval on major changes. Tarento maintains and shares all records of proceedings.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #FFFFFF; padding: 20px 22px;\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px;\">\n              <div style=\"font: 500 17px/1.25 Spectral, Georgia, serif; color: #14202E;\">Change Advisory Board<\u002Fdiv>\n              <span style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #12233D; background: #C9B68B; padding: 6px 8px; white-space: nowrap;\">On demand<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 11px 0 0;\">KB leadership — ACEO, COO, CPO, CFO and SGM (P&amp;C) — with Tarento representatives to be decided by Tarento; COSS may be consulted in an advisory capacity.<\u002Fp>\n            <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785; margin-top: 14px;\">Authority<\u002Fdiv>\n            <div style=\"font: 400 13px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Authorised to review, approve and schedule all changes to iGOT 2.0. The decision of the CAB is final and binding on all parties. After implementation, Tarento updates the as-is document to incorporate the change.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Accountability split<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; border-top: 3px solid #2B4C7E; padding: 22px 24px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">Karmayogi Bharat<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 12px;\">\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\"><strong style=\"font-weight: 600; color: #14202E;\">COO · Programme Head<\u002Fstrong> — day-to-day execution across both workstreams, weekly programme reviews, escalation management, resolving operational bottlenecks<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\"><strong style=\"font-weight: 600; color: #14202E;\">CPO · Product Vision &amp; Strategy<\u002Fstrong> — overall Product Head for both tracks; approves target architecture, major design decisions and go-live; prioritises the unified backlog including AI use cases<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\"><strong style=\"font-weight: 600; color: #14202E;\">PMC<\u002Fstrong> — KB's single point of programme coordination with Tarento and advisory stakeholders; tracks cross-track dependencies and milestone readiness<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\"><strong style=\"font-weight: 600; color: #14202E;\">Functional<\u002Fstrong> — defines business requirements and user journeys, validates features and acceptance criteria, leads consultations with ministries, states, CTIs and ATIs, drives adoption<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0;\"><strong style=\"font-weight: 600; color: #14202E;\">Quality &amp; Acceptance<\u002Fstrong> — conducts UAT, approves production releases, reviews implementation against agreed KPIs<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; border-top: 3px solid #8C3A2B; padding: 22px 24px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Tarento<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 12px;\">\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\"><strong style=\"font-weight: 600; color: #14202E;\">Technical architecture<\u002Fstrong> — defines the target architecture for both upgrade and AI platform; owns execution of the Sunbird upgrade; hands off stable, documented APIs and data contracts for the AI layer to consume<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\"><strong style=\"font-weight: 600; color: #14202E;\">Programme management<\u002Fstrong> — operates a dedicated PMO for both tracks; maintains the master schedule, RAID log and status-reporting cadence; single point of contractual and delivery accountability<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\"><strong style=\"font-weight: 600; color: #14202E;\">Open-source leadership<\u002Fstrong> — signs off alignment with the Sunbird ecosystem, manages upstream contributions and compatibility with future releases, promotes reusable components and avoids lock-in at the architectural level<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\"><strong style=\"font-weight: 600; color: #14202E;\">Technical governance<\u002Fstrong> — contracts and manages subcontractor agencies after alignment with KB; sets coding standards and architecture guidelines; owns the integration seam between the two workstreams<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\"><strong style=\"font-weight: 600; color: #14202E;\">Engineering oversight<\u002Fstrong> — guides core component implementation, owns QA and UAT coordination, risk escalation and status reporting; ensures subcontractors comply with security, accessibility and DPDP standards<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0;\"><strong style=\"font-weight: 600; color: #14202E;\">Capacity building<\u002Fstrong> — mentors implementation agencies and facilitates technical knowledge transfer<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Dependencies that can move the plan<\u002Fh2>\n      <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; margin: 18px 0 0;\">\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.6fr) minmax(0, 0.7fr); gap: 20px; padding: 13px 22px; background: #F7F4ED; border-bottom: 1px solid #E2DED6;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Dependency<\u002Fdiv>\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Impact if delayed<\u002Fdiv>\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Owner<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.6fr) minmax(0, 0.7fr); gap: 20px; padding: 14px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 14px/1.5 'Instrument Sans', sans-serif; color: #14202E;\">Source code access<\u002Fdiv><div style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665;\">Repositories authored or maintained by the incumbent MSP. Without them, the current-state assessment and gap analysis cannot complete, blocking the Phase 0 exit gate.<\u002Fdiv><div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785;\">KB<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.6fr) minmax(0, 0.7fr); gap: 20px; padding: 14px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 14px/1.5 'Instrument Sans', sans-serif; color: #14202E;\">Environments &amp; credentials<\u002Fdiv><div style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665;\">Validated API keys, service accounts and access for AI model providers, cloud services, data platforms and external integrations. Blocks platform build-up.<\u002Fdiv><div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785;\">KB<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.6fr) minmax(0, 0.7fr); gap: 20px; padding: 14px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 14px/1.5 'Instrument Sans', sans-serif; color: #14202E;\">Data source onboarding<\u002Fdiv><div style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665;\">Engagement with ministries to set up ingestion pipelines. A thin knowledge layer limits every downstream AI use case.<\u002Fdiv><div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785;\">KB &amp; MDOs<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.6fr) minmax(0, 0.7fr); gap: 20px; padding: 14px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 14px/1.5 'Instrument Sans', sans-serif; color: #14202E;\">Competency dictionary sign-off<\u002Fdiv><div style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665;\">Ministries own final validation of domain competency dictionaries, taxonomy and role mappings. Personalisation quality depends on them.<\u002Fdiv><div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785;\">Ministries<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.6fr) minmax(0, 0.7fr); gap: 20px; padding: 14px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 14px/1.5 'Instrument Sans', sans-serif; color: #14202E;\">External platform integration<\u002Fdiv><div style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665;\">Co-pilot embedding requires agreement and interfaces from e-HRMS, SPARROW, NIC mail and eOffice owners — parties outside this engagement.<\u002Fdiv><div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785;\">KB &amp; NIC / DoPT<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.6fr) minmax(0, 0.7fr); gap: 20px; padding: 14px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 14px/1.5 'Instrument Sans', sans-serif; color: #14202E;\">Third-party dependency maps<\u002Fdiv><div style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665;\">Integration and dependency maps for third-party libraries, Sunbird blocks and external services in use. Unknowns here become upgrade regressions.<\u002Fdiv><div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785;\">KB<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.6fr) minmax(0, 0.7fr); gap: 20px; padding: 14px 22px;\"><div style=\"font: 500 14px/1.5 'Instrument Sans', sans-serif; color: #14202E;\">Use-case prioritisation<\u002Fdiv><div style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665;\">CPO sign-off on the first-module use-case list. Sequencing, sizing and the week-wise plan all follow from it.<\u002Fdiv><div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785;\">KB · CPO<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">How risk, change and quality are managed<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Risk &amp; issue management<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">Tarento develops a Risk Management Plan, identifies and evaluates project risks, and develops cost-effective mitigation strategies. A Risk Assessment against KB's risk appetite produces the KB Enterprise Risk Register. An issues management procedure identifies, tracks and resolves issues. Both are prepared in consultation with KB. Risk and issue management is a standing Steering Committee agenda item as required.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Change control<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">KB recognises that changes may be required before, during and after rollout, and may carry financial impact. A Change Control system maintains all records. The procedure protects the environment from uncontrolled changes, avoids changes that are not reviewed, approved or analysed, and controls the impact on service delivery. The CAB's decision is final and binding.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Quality, audit &amp; compliance<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">Information security aligned to ISO 27001 specifications, with the project and sustenance aligned to industry best practice. An independent Tarento quality team audits iGOT 2.0 against that standard at least annually per process, sharing results directly with KB alongside an action plan for observations. KB may also engage independent auditors, which Tarento supports on a pre-agreed calendar.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font: 400 14px/1.7 'Instrument Sans', sans-serif; color: #4A5665; margin: 20px 0 0; max-width: 860px;\">Tarento circulates formal progress reports at agreed intervals covering progress against the Project Management Plan, the status of all risks and issues, and exceptions with recommended resolutions. KB may request review reports beyond the standard weekly cadence, and may require that project discussions take place at KB's office. Tarento also maintains an escalation matrix of key contacts and hierarchy for issue resolution.<\u002Fp>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 12 · ACCEPTANCE, LAUNCH & ROADMAP -->\n    <sc-if value=\"{{ s12 }}\">\n    <article data-screen-label=\"12 Acceptance Launch and Roadmap\" style=\"max-width: 1020px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 12<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">Acceptance, Launch &amp; Roadmap<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">Nothing scales until it passes its gate. Release runs through controlled cohorts, compared against baselines, and scales only when quality, safety, adoption, performance and cost gates are met.<\u002Fp>\n\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 44px 0 0;\">Definition of done<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 22px 24px;\">\n          <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">Track A · Sunbird modernisation<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 12px;\">\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\">Current State Assessment delivered<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\">Gap Analysis, including service-level changes required<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\">Upgrade Strategy agreed with the client<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\">Execution of the upgrade strategy post alignment<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\">All new features validated for production-ready scale<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0;\">Updated documentation and knowledge transfer document<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 22px 24px;\">\n          <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">Track B · AI platform<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 12px;\">\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\">Gap analysis and prioritised first-module use-case list<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\">AI platform architecture and project plan signed off<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\">Core AI services and prioritised modules delivered<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\">Performance validation and national-scale testing passed<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0; border-bottom: 1px solid #F0ECE3;\">Governance compliance and validation audit report<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 9px 0;\">SOPs and operations manuals for adoption support<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #F7F4ED; border: 1px solid #E2DED6; padding: 18px 20px; margin: 16px 0 0;\">\n        <p style=\"font: 400 14px/1.65 'Instrument Sans', sans-serif; color: #3A4654; margin: 0;\"><strong style=\"font-weight: 600; color: #14202E;\">Acceptance authority.<\u002Fstrong> KB's Quality &amp; Acceptance function conducts User Acceptance Testing, approves production releases, and reviews implementation against agreed KPIs. The CPO approves product architecture, major design decisions and the implementation roadmap, and gives final go-live sign-off. Every use case is assessed on cost per AI interaction, cost per active learner and measurable public value before national rollout.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Rollout sequence<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background: #E2DED6; border: 1px solid #E2DED6; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; padding: 20px 20px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Step 1 · POC<\u002Fdiv>\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E; margin-top: 9px;\">Selected departments and users<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Test and go live with a controlled cohort. GTM strategy is finalised on the basis of POC results, not ahead of them.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 20px 20px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Step 2 · Foundational release<\u002Fdiv>\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E; margin-top: 9px;\">All central ministries, selected states<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Selected MDOs onboarded onto the AI-powered experience; an agreed percentage of user traffic migrated to the upgraded platform.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 20px 20px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Step 3 · Proof of scale<\u002Fdiv>\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E; margin-top: 9px;\">All learners across all MDOs<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Every learner onboarded onto the first module, with remaining prioritised modules delivered alongside.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 20px 20px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Step 4 · DPI<\u002Fdiv>\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E; margin-top: 9px;\">Ecosystem partners<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Key features and services made available to ecosystem partners as digital public infrastructure.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Handover to Karmayogi Bharat<\u002Fh2>\n      <p style=\"font: 400 15px/1.7 'Instrument Sans', sans-serif; color: #4A5665; margin: 14px 0 0; max-width: 820px;\">Institutionalisation of the platform is a mandatory strategic mandate. The objective is to minimise long-term vendor dependency, empowering KB to independently manage and evolve the AI platform.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 18px 18px;\">\n          <div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #3A4654;\">Complete source code and infrastructure configuration handover<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 18px 18px;\">\n          <div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #3A4654;\">Detailed architecture, workflow and API documentation<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 18px 18px;\">\n          <div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #3A4654;\">Operational playbooks, SOPs and governance manuals<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 18px 18px;\">\n          <div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #3A4654;\">Milestone-based shadow and reverse-shadow support models<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 18px 18px;\">\n          <div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #3A4654;\">Targeted training workshops for technical and business leadership<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font: 400 14px/1.7 'Instrument Sans', sans-serif; color: #4A5665; margin: 20px 0 0; max-width: 860px;\">A structured Transition and Exit Management plan accompanies the technical proposal and is updated quarterly, or earlier on major change. It covers complete system documentation, an asset inventory, assessment support including licences, solution walkthroughs and demos, handover of software, program, configuration and setup files, at least one month of shadow support, closure of all critical open issues at exit, and knowledge transfer to the incoming or existing MSP. Exit management provisions are invoked at least one month before agreement expiry, or on notice of termination.<\u002Fp>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Future evolution<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; border-top: 3px solid #1F5C4A; padding: 22px 24px;\">\n          <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">A governance SLM<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">Successive benchmarked releases progress an open-weight base toward a multilingual, domain-specialised small language model for public-sector capacity building — powering role-aware guidance, personalised pathways, competency plans, project-relevant recommendations, assessments and institutional capability planning.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; border-top: 3px solid #2B4C7E; padding: 22px 24px;\">\n          <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">Federation across institutions<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">A standard metadata and repository structure across all MDOs, with domain competency ownership resting with each ministry — so the platform grows by institutions joining it rather than by central authoring capacity.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; border-top: 3px solid #8C3A2B; padding: 22px 24px;\">\n          <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">Reusable public infrastructure<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">Core architecture, source code, data, prompts, evaluation assets, knowledge indexes and deployment configurations remain under KB ownership, published to ecosystem partners as DPI with open standards, interoperable APIs and a multi-model gateway.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ tbd }}\">\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 18px 20px; margin: 26px 0 0;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #8C3A2B;\">Open · to be agreed with KB<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Module-level acceptance criteria, the traffic-migration percentage that closes the Phase 2 gate, UAT entry and exit criteria, SLA definitions, and the named MDOs in the Phase 1 POC cohort.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startSection&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Portal&quot;},&quot;showTbdBlocks&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Portal&quot;},&quot;compactRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Portal&quot;}}\">\nconst META = [\n  [\"Executive Overview\", \"One-page understanding of the entire proposal\"],\n  [\"Requirement Understanding\", \"What we believe the client is asking for\"],\n  [\"Product Vision & Scope\", \"What iGOT 2.0 will achieve, and boundaries\"],\n  [\"User & Business Journeys\", \"How different personas will use the platform\"],\n  [\"PRD / Functional Requirements\", \"Detailed feature-level requirements\"],\n  [\"UX / Experience Design\", \"Screens, journeys, IA and interaction model\"],\n  [\"Solution Architecture\", \"Technical architecture and major components\"],\n  [\"Integration & Data\", \"APIs, external systems, data flows and migration\"],\n  [\"AI / Analytics / Personalisation\", \"AI capabilities, recommendations, intelligence and analytics\"],\n  [\"Delivery Plan & Estimation\", \"Effort, team, phases, milestones and commercials\"],\n  [\"Dependencies, Risks & Governance\", \"What can impact delivery and how it will be managed\"],\n  [\"Acceptance, Launch & Roadmap\", \"Definition of done, rollout and future evolution\"]\n];\n\nclass Component extends DCLogic {\n  state = { active: null };\n\n  get active() {\n    const p = parseInt(this.props.startSection, 10);\n    const fallback = (p >= 1 && p <= 12) ? p : 1;\n    return this.state.active == null ? fallback : this.state.active;\n  }\n\n  select(n) {\n    this.setState({ active: n });\n    const panel = document.querySelector('.panel');\n    if (panel) panel.scrollTop = 0;\n  }\n\n  renderVals() {\n    const active = this.active;\n    const showPurpose = this.props.compactRail !== true;\n    const vals = {\n      tbd: this.props.showTbdBlocks !== false,\n      sections: META.map((m, i) => {\n        const n = i + 1;\n        const on = n === active;\n        return {\n          num: String(n).padStart(2, \"0\"),\n          title: m[0],\n          purpose: m[1],\n          showPurpose: showPurpose,\n          bg: on ? \"rgba(255,255,255,0.10)\" : \"transparent\",\n          mark: on ? \"#C9B68B\" : \"transparent\",\n          fg: on ? \"#FFFFFF\" : \"#C3D0E0\",\n          go: () => this.select(n)\n        };\n      })\n    };\n    for (let n = 1; n <= 12; n++) vals[\"s\" + n] = n === active;\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
