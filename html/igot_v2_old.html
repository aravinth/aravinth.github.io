        e.target.tagName, String(e.target.src || e.target.href || ''));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

        }

    const resourceMap = {};
    for (const entry of extResources) {

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6eff6f6b-c370-4222-b4fa-3b078ba5a10b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #FBFAF7; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: #2B4C7E; text-decoration: none; border-bottom: 1px solid rgba(43,76,126,0.35); }\n  a:hover { color: #8C3A2B; border-bottom-color: rgba(140,58,43,0.5); }\n  ::selection { background: #E4DCCB; }\n  #__bundler_thumbnail { display: none; }\n  .rail::-webkit-scrollbar, .panel::-webkit-scrollbar { width: 9px; }\n  .rail::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 9px; }\n  .panel::-webkit-scrollbar-thumb { background: #DDD7CB; border-radius: 9px; }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"display: grid; grid-template-columns: clamp(228px, 23vw, 318px) minmax(0, 1fr); height: 100vh; min-height: 640px; background: #FBFAF7; font-family: 'Instrument Sans', system-ui, sans-serif;\">\n\n  <nav class=\"rail\" style=\"background: #12233D; color: #E8EDF4; overflow-y: auto; display: flex; flex-direction: column; border-right: 1px solid #0B1727;\">\n    <div style=\"padding: 30px 26px 22px; border-bottom: 1px solid rgba(255,255,255,0.1);\">\n      <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #93A8C4;\">Karmayogi Bharat<\u002Fdiv>\n      <div style=\"font: 600 30px/1.05 Spectral, Georgia, serif; letter-spacing: -0.015em; color: #FFFFFF; margin-top: 12px;\">iGOT 2.0<\u002Fdiv>\n      <div style=\"font: 400 14px/1.45 Spectral, Georgia, serif; color: #9DB2CD; margin-top: 6px;\">Project Scope &amp; Delivery Portal<\u002Fdiv>\n      <div style=\"display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap;\">\n        <span style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #12233D; background: #C9B68B; padding: 6px 9px;\">For KB Leadership<\u002Fspan>\n        <span style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #9DB2CD; border: 1px solid rgba(255,255,255,0.2); padding: 6px 9px;\">v1 · 14 Sep<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 18px 0 40px; display: flex; flex-direction: column;\">\n      <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"12\">\n        <button sc-camel-on-click=\"{{ s.go }}\" style=\"appearance: none; background: {{ s.bg }}; border: 0; border-left: 3px solid {{ s.mark }}; text-align: left; padding: 13px 24px 13px 21px; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: baseline; font-family: 'Instrument Sans', sans-serif; width: 100%;\" style-hover=\"background: rgba(255,255,255,0.07);\">\n          <span style=\"font: 500 12px/1.3 'Instrument Sans', sans-serif; color: #7D93B2; font-variant-numeric: tabular-nums;\">{{ s.num }}<\u002Fspan>\n          <span style=\"display: block; min-width: 0;\">\n            <span style=\"display: block; font: 500 14px/1.35 'Instrument Sans', sans-serif; color: {{ s.fg }}; letter-spacing: -0.005em;\">{{ s.title }}<\u002Fspan>\n            <sc-if value=\"{{ s.showPurpose }}\">\n              <span style=\"display: block; font: 400 11.5px/1.45 'Instrument Sans', sans-serif; color: #7188A8; margin-top: 4px;\">{{ s.purpose }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: auto; padding: 20px 26px 26px; border-top: 1px solid rgba(255,255,255,0.1);\">\n      <div style=\"font: 400 11.5px/1.6 'Instrument Sans', sans-serif; color: #6E84A4;\">Prepared by Tarento · technical advisory from COSS. Source: iGOT 2.0 Project Scope, 44 pp.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main class=\"panel\" style=\"overflow-y: auto; background: #FBFAF7;\">\n\n    <!-- 1 · EXECUTIVE OVERVIEW -->\n    <sc-if value=\"{{ s1 }}\" hint-placeholder-val=\"{{ true }}\">\n    <article data-screen-label=\"01 Executive Overview\" style=\"max-width: 940px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 01<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">Executive Overview<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">Mission Karmayogi 2.0 shifts iGOT's mandate from enabling digital access and course completions to delivering measurable improvements in learner experience, competency development, institutional intelligence and governance effectiveness.<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1px; background: #E2DED6; border: 1px solid #E2DED6; margin: 44px 0 0;\">\n        <div style=\"background: #FFFFFF; padding: 26px 28px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #2B4C7E;\">Track A<\u002Fdiv>\n          <div style=\"font: 500 22px/1.25 Spectral, Georgia, serif; color: #14202E; margin-top: 12px;\">Sunbird Platform Modernisation<\u002Fdiv>\n          <p style=\"font: 400 14.5px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 12px 0 0;\">Upgrade Lern, Knwlg and Obsrv from the 4th-gen baseline to the latest stable release (7, 8 or Spark). Address technical debt, security exposure, performance and maintainability while preserving architecture, data assets and operational continuity at current scale.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 26px 28px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #8C3A2B;\">Track B<\u002Fdiv>\n          <div style=\"font: 500 22px/1.25 Spectral, Georgia, serif; color: #14202E; margin-top: 12px;\">iGOT 2.0 AI Platform<\u002Fdiv>\n          <p style=\"font: 400 14.5px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 12px 0 0;\">Build a Karmayogi Bharat-owned AI data and intelligence platform that works seamlessly with the modernised core — a centralised AI core powering learner and content-creator use cases alike, with governed knowledge, RAG and model orchestration.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #6B7785; margin: 14px 0 0;\">Both tracks constitute a unified strategic engagement executed by a single Partner, ensuring a synchronised architecture, centralised governance and a shared delivery cadence.<\u002Fp>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">The product, in one line<\u002Fh2>\n      <p style=\"font: 400 17px/1.6 Spectral, Georgia, serif; color: #14202E; margin: 14px 0 0; max-width: 780px;\">Competency-first, AI-powered, hyper-personalised, embedded in relevant work contexts, federated across institutions and trusted by design.<\u002Fp>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 0;\">\n        <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 9px 12px;\">Competency &amp; context first<\u002Fspan>\n        <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 9px 12px;\">Model-agnostic<\u002Fspan>\n        <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 9px 12px;\">Open-weight DPI<\u002Fspan>\n        <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 9px 12px;\">Cloud-agnostic<\u002Fspan>\n        <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 9px 12px;\">KB-owned<\u002Fspan>\n        <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 9px 12px;\">Reuse before rebuilding<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Delivery at a glance<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: #E2DED6; border: 1px solid #E2DED6; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Phase 0<\u002Fdiv>\n          <div style=\"font: 500 15px/1.3 Spectral, Georgia, serif; color: #14202E; margin-top: 8px;\">Aug–Sep 2026<\u002Fdiv>\n          <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785; margin-top: 6px;\">Align, plan, gap analysis<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Phase 1<\u002Fdiv>\n          <div style=\"font: 500 15px/1.3 Spectral, Georgia, serif; color: #14202E; margin-top: 8px;\">Oct–Dec 2026<\u002Fdiv>\n          <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785; margin-top: 6px;\">Upgrade go-live, AI MVP<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Phase 2<\u002Fdiv>\n          <div style=\"font: 500 15px/1.3 Spectral, Georgia, serif; color: #14202E; margin-top: 8px;\">Jan–Mar 2027<\u002Fdiv>\n          <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785; margin-top: 6px;\">Scale to ministries<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Phase 3<\u002Fdiv>\n          <div style=\"font: 500 15px/1.3 Spectral, Georgia, serif; color: #14202E; margin-top: 8px;\">Apr–Sep 2027<\u002Fdiv>\n          <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785; margin-top: 6px;\">Proof of scale<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Phase 4<\u002Fdiv>\n          <div style=\"font: 500 15px/1.3 Spectral, Georgia, serif; color: #14202E; margin-top: 8px;\">Oct 2027 →<\u002Fdiv>\n          <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #6B7785; margin-top: 6px;\">Sustainable DPI<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">What this portal covers<\u002Fh2>\n      <p style=\"font: 400 15px/1.7 'Instrument Sans', sans-serif; color: #4A5665; margin: 14px 0 0; max-width: 780px;\">Twelve sections take the signed scope of work from requirement understanding through to acceptance and roadmap. Sections drawn directly from the scope document are written in full; anything that requires a decision from KB or a working session is marked as open.<\u002Fp>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 2 · REQUIREMENT UNDERSTANDING -->\n    <sc-if value=\"{{ s2 }}\">\n    <article data-screen-label=\"02 Requirement Understanding\" style=\"max-width: 940px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 02<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">Requirement Understanding<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">The current platform has successfully established a national digital learning ecosystem. Learning on it, however, remains catalogue-driven, course-centric and not targeted at the individual learner.<\u002Fp>\n\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 44px 0 0;\">Eight challenges we are asked to solve<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1px; background: #E2DED6; border: 1px solid #E2DED6; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; padding: 22px 24px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">01 · One-size-fits-all learning<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Every learner essentially sees the same catalogue. Designation-level training plans exist but do not cater to individual needs. The platform understands, but does not leverage, who the learner is and what gaps exist.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 22px 24px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">02 · Learning disconnected from work<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Learning happens inside iGOT while work happens in Sparrow, eHRMS, NIC mail, eOffice and file-management systems. There is no on-the-fly contextual support.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 22px 24px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">03 · Static learning paths<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Journeys are manually designed and do not evolve when a designation changes, when competency is acquired outside iGOT, or when policy changes.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 22px 24px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">04 · Reactive content creation<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Content is commissioned manually after a time-specific study against CBP outputs — a slow, manual process with heavy SME dependency.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 22px 24px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">05 · Content quality issues<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Quality depends on subjective manual review. No automated, objective checks exist for policy compliance, competency alignment, duplication, accessibility or multilingual quality.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 22px 24px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">06 · Course-specific assessments<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Assessments answer whether a course was completed, not whether the learner gained the competency needed to perform the job.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 22px 24px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">07 · Limited multilingual intelligence<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Content is developed largely in English and possibly translated to Hindi. Translation into other Indic languages remains expensive and slow.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 22px 24px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">08 · Microlearning at scale<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Microlearning generation is either non-existent or requires manual effort, placing a question mark on scalability.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Two strategic mandates<\u002Fh2>\n      <div style=\"display: flex; flex-direction: column; gap: 14px; margin: 18px 0 0;\">\n        <div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 18px; background: #FFFFFF; border: 1px solid #E2DED6; padding: 22px 24px;\">\n          <div style=\"font: 500 30px/1 Spectral, Georgia, serif; color: #C9B68B;\">1<\u002Fdiv>\n          <div>\n            <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">Foundational modernisation<\u002Fdiv>\n            <p style=\"font: 400 14.5px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 8px 0 0;\">Evolve the core platform from the current Sunbird v4.x baseline to the latest stable release and subsequent modernisation, such that backward compatibility and business continuity are ensured.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 18px; background: #FFFFFF; border: 1px solid #E2DED6; padding: 22px 24px;\">\n          <div style=\"font: 500 30px/1 Spectral, Georgia, serif; color: #C9B68B;\">2<\u002Fdiv>\n          <div>\n            <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">AI platform and use cases — build and stabilise<\u002Fdiv>\n            <p style=\"font: 400 14.5px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 8px 0 0;\">Architect, develop and operationally deploy an advanced AI capability layer focused on hyper-personalisation, intelligent content lifecycles and automated assessment frameworks, leveraging a model strategy suited to each use case.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">What we need from KB to proceed<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Code &amp; environments<\u002Fdiv>\n          <p style=\"font: 400 14px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">All source repositories for components in scope, including those authored or maintained by the current MSP or any incumbent vendor. Environment, architecture and infrastructure documentation and configurations.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Existing documentation<\u002Fdiv>\n          <p style=\"font: 400 14px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">Technical-debt, customisation and forked-code documentation. Integration and dependency maps covering third-party libraries, Sunbird building blocks and external services in use.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Access &amp; credentials<\u002Fdiv>\n          <p style=\"font: 400 14px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">Validated API keys, service accounts and access mechanisms for AI model providers, cloud infrastructure services, data platforms and external integrations.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Data sources<\u002Fdiv>\n          <p style=\"font: 400 14px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">Identification of and engagement with the data sources needed to build the knowledge layer, so that ingestion pipelines can be set up during Phase 0.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 3 · PRODUCT VISION & SCOPE -->\n    <sc-if value=\"{{ s3 }}\">\n    <article data-screen-label=\"03 Product Vision and Scope\" style=\"max-width: 940px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 03<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">Product Vision &amp; Scope<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">iGOT 2.0 becomes an intelligent, modern platform that continuously understands the capacity requirements of every learner, recommends personalised interventions, supports decision-making in the flow of work, and enables ministries to build a future-ready workforce.<\u002Fp>\n\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 44px 0 0;\">Seven design principles<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1px; background: #E2DED6; border: 1px solid #E2DED6; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; padding: 20px 22px;\">\n          <div style=\"font: 500 15.5px/1.3 Spectral, Georgia, serif; color: #14202E;\">Competency &amp; context first<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 8px 0 0;\">Everything begins with competencies rather than courses or content.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 20px 22px;\">\n          <div style=\"font: 500 15.5px/1.3 Spectral, Georgia, serif; color: #14202E;\">Scale and unit economics<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 8px 0 0;\">Engineer for population scale, burst traffic and graceful degradation. Monitor cost per AI interaction and per active learner; route workloads to the smallest model that meets the quality threshold.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 20px 22px;\">\n          <div style=\"font: 500 15.5px/1.3 Spectral, Georgia, serif; color: #14202E;\">Build the core; partner at the edge<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 8px 0 0;\">KB retains ownership and strategic control. Specialised partners may provide models, multimedia generation, voice, translation and acceleration through replaceable interfaces.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 20px 22px;\">\n          <div style=\"font: 500 15.5px/1.3 Spectral, Georgia, serif; color: #14202E;\">Model-agnostic, modular, interoperable<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 8px 0 0;\">The platform works well with different models. No vendor or model lock-in.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 20px 22px;\">\n          <div style=\"font: 500 15.5px/1.3 Spectral, Georgia, serif; color: #14202E;\">Reuse before rebuilding<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 8px 0 0;\">Retain the strengths of the existing iGOT and Sunbird platform, telemetry, content and integrations.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 20px 22px;\">\n          <div style=\"font: 500 15.5px/1.3 Spectral, Georgia, serif; color: #14202E;\">Privacy, security, auditability, responsible AI by design<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 8px 0 0;\">Data minimisation, purpose limitation, consent where required, and deployment flexibility aligned with government policies and DPDP guidelines.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 20px 22px; grid-column: 1 / -1;\">\n          <div style=\"font: 500 15.5px/1.3 Spectral, Georgia, serif; color: #14202E;\">Evidence-led and continuously improving<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 8px 0 0;\">Release through controlled cohorts, compare against baselines, capture feedback and outcomes, and scale only when quality, safety, adoption, performance and cost gates are met.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Expected outcomes<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 0 40px; margin: 18px 0 0;\">\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"font: 400 15px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Increased course completion rates<\u002Fdiv>\n          <div style=\"font: 400 15px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Increased learning hours spent on platform<\u002Fdiv>\n          <div style=\"font: 400 15px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Improved assessment performance<\u002Fdiv>\n          <div style=\"font: 400 15px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Reduced content creation time<\u002Fdiv>\n          <div style=\"font: 400 15px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Faster onboarding of new learners<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"font: 400 15px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Lower dependency on manual content creation<\u002Fdiv>\n          <div style=\"font: 400 15px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Better utilisation of existing content<\u002Fdiv>\n          <div style=\"font: 400 15px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Improved policy implementation through just-in-time learning<\u002Fdiv>\n          <div style=\"font: 400 15px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Implementable, contextual, at-workplace learning<\u002Fdiv>\n          <div style=\"font: 400 15px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Secure platform<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ tbd }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 18px 20px; margin: 24px 0 0;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #8C3A2B;\">Open · to be agreed with KB<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Baseline values and target thresholds for each outcome, and the measurement window against which they are assessed. The scope document names the outcomes but does not quantify them.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Boundaries<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; border-top: 3px solid #1F5C4A; padding: 22px 24px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #1F5C4A;\">In scope<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 12px;\">\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0; border-bottom: 1px solid #F0ECE3;\">Sunbird 4.x → latest stable upgrade, end to end<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0; border-bottom: 1px solid #F0ECE3;\">Centralised AI core: orchestration, RAG, agents, guardrails<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0; border-bottom: 1px solid #F0ECE3;\">Knowledge and data layer, continuous ingestion pipeline<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0; border-bottom: 1px solid #F0ECE3;\">Priority AI use cases on creation and consumption sides<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0; border-bottom: 1px solid #F0ECE3;\">National-scale performance, security and responsible-AI framework<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0;\">Handover and transition to KB ownership<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; border-top: 3px solid #8C3A2B; padding: 22px 24px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Boundaries &amp; exclusions<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 12px;\">\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0; border-bottom: 1px solid #F0ECE3;\">Ownership of domain competency dictionaries, taxonomy and role mappings rests with the concerned Ministry or Department<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0; border-bottom: 1px solid #F0ECE3;\">Foundation-model pre-training is not in scope; the SLM is a long-term journey from an open-weight base<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0; border-bottom: 1px solid #F0ECE3;\">Content authoring by SMEs remains a KB and MDO function; the platform assists rather than replaces<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0; border-bottom: 1px solid #F0ECE3;\">Changes to external government systems sit with their owners; we integrate through their published interfaces<\u002Fdiv>\n            <div style=\"font: 400 14px/1.55 'Instrument Sans', sans-serif; color: #3A4654; padding: 8px 0;\">Historical data migration and reconciliation only if required<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 4 · USER & BUSINESS JOURNEYS -->\n    <sc-if value=\"{{ s4 }}\">\n    <article data-screen-label=\"04 User and Business Journeys\" style=\"max-width: 1120px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 04<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">User &amp; Business Journeys<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">Four personas carry the platform's value. Each journey below shows the shift from today's catalogue-driven experience to a competency-first one.<\u002Fp>\n\n      <div style=\"display: flex; flex-direction: column; gap: 22px; margin: 44px 0 0;\">\n\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6;\">\n          <div style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 24px; border-bottom: 1px solid #E2DED6; background: #F7F4ED; flex-wrap: wrap;\">\n            <div style=\"font: 500 20px/1.2 Spectral, Georgia, serif; color: #14202E;\">The Learner<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.4 'Instrument Sans', sans-serif; color: #6B7785;\">Civil servant across a central ministry or state MDO · web and mobile<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: #E8E4DA;\">\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">Profile<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Role, designation, grade, MDO and language captured once; competency requirements derived from the Karmayogi Competency Model.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">Diagnose<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Competency gap diagnostics compare required proficiency against assessment evidence, completions and prior assignments.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">Personal path<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">A personalised home page and dynamic learning path (AI-CBP) that re-plans when designation, policy or competency changes.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">Learn in flow<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">AI Tutor for conversational support; micro-learnings and “Ask iGOT” available by voice or text inside eOffice, SPARROW, eHRMS and NIC mail.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">Evidence<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Competency-first and adaptive assessments, QR-backed verifiable credentials in a digital passbook, longitudinal competency record.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6;\">\n          <div style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 24px; border-bottom: 1px solid #E2DED6; background: #F7F4ED; flex-wrap: wrap;\">\n            <div style=\"font: 500 20px/1.2 Spectral, Georgia, serif; color: #14202E;\">The Content Provider<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.4 'Instrument Sans', sans-serif; color: #6B7785;\">SME, instructional designer, CTI / ATI · content portal<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: #E8E4DA;\">\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Demand signal<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Competency gap analyser and training demand forecasting surface where content is missing, rather than waiting for a manual study.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Author<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Intelligent course authoring grounded in authoritative Acts, rules, policies, SOPs and institutional knowledge, in HTML, PPTX or PDF.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Tag &amp; translate<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Automated metadata and KCM competency tagging, target audience, learning outcomes and difficulty. Multilingual transformation with automated subtitling.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Validate<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Automated quality and compliance checks, then a formal two-level review and curation workflow with human sign-off.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Monitor<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Content health cards track performance and multilingual feedback after publication, prompting revision, retirement or reuse.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6;\">\n          <div style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 24px; border-bottom: 1px solid #E2DED6; background: #F7F4ED; flex-wrap: wrap;\">\n            <div style=\"font: 500 20px/1.2 Spectral, Georgia, serif; color: #14202E;\">The MDO Administrator<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.4 'Instrument Sans', sans-serif; color: #6B7785;\">Nodal officer / CBP owner in a ministry, department or state · MDO &amp; CBP portals<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: #E8E4DA;\">\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">Onboard<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Organisation and user onboarding through Keycloak-based SSO, with a standard metadata and repository structure for interoperability.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">FRAC &amp; CBP<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">AI-driven FRACing turns draft Capacity Building Plans into roles, activities, required competencies and proficiency levels.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">Validate ownership<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">The ministry refines and signs off its domain competency dictionary, taxonomy, role mappings and document repository sources.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">Plan capacity<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Institutional capability planning against departmental priorities, schemes, projects and annual plans.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #2B4C7E;\">Report<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Role-based reporting for programme designers, programme managers and state report admins; governance dashboards.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6;\">\n          <div style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 24px; border-bottom: 1px solid #E2DED6; background: #F7F4ED; flex-wrap: wrap;\">\n            <div style=\"font: 500 20px/1.2 Spectral, Georgia, serif; color: #14202E;\">Ministry &amp; KB Leadership<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.4 'Instrument Sans', sans-serif; color: #6B7785;\">Secretaries, CEO and CPO, KB · decision support<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: #E8E4DA;\">\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Observe<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Full-level telemetry — who, what, where, using what, in relation to what — through the modernised Obsrv stack.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Diagnose<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Institutional capability gaps across MDOs, with competency and context graphs behind the numbers.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Decide<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Data-driven decision support for ministries, states and leadership, with citations back to source.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Govern cost<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Cost per AI interaction, cost per active learner and measurable public value assessed before national rollout.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; padding: 18px 16px;\">\n              <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Scale<\u002Fdiv>\n              <p style=\"font: 400 13.5px/1.55 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Controlled cohort release, baseline comparison, then scale when quality, safety, adoption, performance and cost gates are met.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ tbd }}\">\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 18px 20px; margin: 26px 0 0;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #8C3A2B;\">Open · Phase 0 workshop<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Detailed persona research, pain-point validation with real MDO users, and journey prioritisation. The scope document names the modalities and use cases; the journeys above are our reading of them and need confirmation from KB's functional team.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 5 · PRD / FUNCTIONAL REQUIREMENTS -->\n    <sc-if value=\"{{ s5 }}\">\n    <article data-screen-label=\"05 PRD Functional Requirements\" style=\"max-width: 1020px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 05<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">PRD / Functional Requirements<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">Feature-level requirements across both tracks, as stated in the scope of work. The indicative scope is explicitly non-exhaustive and extends to enhancements mutually agreed between client and partner.<\u002Fp>\n\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 44px 0 0;\">A · Sunbird modernisation — indicative scope<\u002Fh2>\n      <div style=\"border: 1px solid #E2DED6; background: #FFFFFF; margin: 18px 0 0;\">\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.01<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Upgrade to latest content and collection APIs; hierarchical multi-level collection management with metadata tagging.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.02<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Extend content-format support: EPUB, HTML, H5P, ECML.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.03<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Upgrade learner services — enrolment, progress tracking, full-level telemetry (who / what / where / using what / in relation to what); align identity with Keycloak-based SSO for simplified MDO integration.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.04<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Upgrade assessment services to cover missing formats: MathJax-based maths, LaTeX-based chemistry, match-the-following, fill-in-the-blanks.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.05<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Introduce QR-backed, machine-verifiable digital credentials in a digital passbook, integrated with existing certificate templates and government digital locker.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.06<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Upgrade the search stack: improved indexing, metadata search, and phygital discovery (QR / dial-code) bridging print and digital content.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.07<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Upgrade content lifecycle management: publishing workflows, version management, and a formal two-level review / curation workflow for asset sourcing — reconciled with the existing KarmaQuest MDO-to-content-provider model rather than replacing it.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.08<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Upgrade Android and iOS apps for UX, offline access and in-app upgrades, while maintaining cross-platform support.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.09<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Improve overall security architecture: identity and Keycloak security upgrades, SSO / MDO integration hardening.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.10<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Manage the Learn vertical — programmes, projects, surveys, rubric and non-rubric observations — with role-based reporting for programme designers, programme managers and state report admins.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.11<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Interoperability hardening — KarmaQuest, CIOS Marketplace, LTI compliance.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.12<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Historical data migration and reconciliation, if required.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.13<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Validate all new features for production-ready scale.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">A.14<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Update all internal and partner-facing API documentation and SDKs affected by the upgrade, including enhancements introduced across intermediary releases.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 44px 0 0;\">B · Creation side — AI-assisted content &amp; assessment<\u002Fh2>\n      <div style=\"border: 1px solid #E2DED6; background: #FFFFFF; margin: 18px 0 0;\">\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">B.01<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Intelligent course authoring and structural, work-specific design.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">B.02<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Automated metadata generation, including competency tagging mapped to KCM, target audience, learning outcomes and content difficulty level.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">B.03<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">AI-driven FRACing for Capacity Building Plans.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">B.04<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Personalised role mapping and competency-based recommendations.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">B.05<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">On-demand and planned multilingual transformation, including automated subtitling.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">B.06<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Content quality validation, automated health-card generation and monitoring, including analysis of multilingual user feedback.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">B.07<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Real-time and near-real-time microlearning creation.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">B.08<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Competency gap analyser and training demand forecasting.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">B.09<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">AI-driven, on-demand assessment generation and evaluation — course- and level-first, competency- and level-first, certificate-first, proctored, adaptive testing engine, and auto-evaluation of case-specific answers.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 44px 0 0;\">C · Consumption side — AI-powered learner experience<\u002Fh2>\n      <div style=\"border: 1px solid #E2DED6; background: #FFFFFF; margin: 18px 0 0;\">\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">C.01<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Adaptive learning support through tutor-type mechanisms (AI Tutor), including a conversational learning assistant.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">C.02<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Tool for real-time, contextual learner support (AI Sarthi, ticketing) and faster contextual customer support.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">C.03<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Hyper-personalised learning interventions and course recommendations; user profiling, role-based competency mapping and a personalised home page.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">C.04<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Competency gap diagnostics and dynamic learning pathways (AI-CBP), with user-specific micro-learnings.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">C.05<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Intelligent search and global discovery systems.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">C.06<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Automated assessments and evidence-based competency validation.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">C.07<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Competency Passbook for tracking longitudinal learning records.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">C.08<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">AI-enabled professional pathways and certification frameworks.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 15px 22px;\"><div style=\"font: 500 13px/1.5 'Instrument Sans', sans-serif; color: #A99367; font-variant-numeric: tabular-nums;\">C.09<\u002Fdiv><div style=\"font: 400 14.5px/1.55 'Instrument Sans', sans-serif; color: #3A4654;\">Embedded co-pilot experience within external government platforms, plus “Ask iGOT” — a cross-platform AI assistant supporting voice and text.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ tbd }}\">\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 18px 20px; margin: 26px 0 0;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #8C3A2B;\">Open · Phase 0 deliverable<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Strategic prioritisation of AI use cases into the first module, and week-wise decomposition into modules, deliverables and acceptance criteria. Detailed user stories, acceptance criteria and non-functional targets per requirement follow that prioritisation.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 6 · UX / EXPERIENCE DESIGN -->\n    <sc-if value=\"{{ s6 }}\">\n    <article data-screen-label=\"06 UX Experience Design\" style=\"max-width: 1020px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 06<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">UX / Experience Design<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">The user experience architecture is broken into three primary modalities designed to maximise stakeholder immersion and accessibility.<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: #E2DED6; border: 1px solid #E2DED6; margin: 44px 0 0;\">\n        <div style=\"background: #FFFFFF; padding: 24px 22px;\">\n          <div style=\"font: 500 26px/1 Spectral, Georgia, serif; color: #C9B68B;\">I<\u002Fdiv>\n          <div style=\"font: 500 18px/1.25 Spectral, Georgia, serif; color: #14202E; margin-top: 12px;\">Structured learning delivery<\u002Fdiv>\n          <div style=\"font: 500 12px/1.4 'Instrument Sans', sans-serif; color: #2B4C7E; margin-top: 6px;\">Learner portal · web &amp; mobile<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 12px 0 0;\">Learners engage with hyper-personalised, competency-aligned learning journeys that evolve in real time based on their specific roles and requirements.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 24px 22px;\">\n          <div style=\"font: 500 26px/1 Spectral, Georgia, serif; color: #C9B68B;\">II<\u002Fdiv>\n          <div style=\"font: 500 18px/1.25 Spectral, Georgia, serif; color: #14202E; margin-top: 12px;\">Embedded contextual learning<\u002Fdiv>\n          <div style=\"font: 500 12px/1.4 'Instrument Sans', sans-serif; color: #2B4C7E; margin-top: 6px;\">Co-pilot interfaces in external systems<\u002Fdiv>\n          <p st
