yle=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 12px 0 0;\">Learning in the flow of work through intelligent co-pilots inside e-HRMS, SPARROW and NIC mail. Microlearning insights on demand via “Ask iGOT”, supporting voice and text.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; padding: 24px 22px;\">\n          <div style=\"font: 500 26px/1 Spectral, Georgia, serif; color: #C9B68B;\">III<\u002Fdiv>\n          <div style=\"font: 500 18px/1.25 Spectral, Georgia, serif; color: #14202E; margin-top: 12px;\">Intelligent content management<\u002Fdiv>\n          <div style=\"font: 500 12px/1.4 'Instrument Sans', sans-serif; color: #2B4C7E; margin-top: 6px;\">Content portal<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 12px 0 0;\">Content providers create comprehensive, engaging, work-based content and assessments in multiple formats, with quality criteria and checks as first-class citizens.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Information architecture — learner portal<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 18px 18px;\">\n          <div style=\"font: 500 15px/1.3 Spectral, Georgia, serif; color: #14202E;\">Home<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 10px;\">\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">Personalised for me<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">Continue learning<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">Today's microlearning<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0;\">Ask iGOT<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 18px 18px;\">\n          <div style=\"font: 500 15px/1.3 Spectral, Georgia, serif; color: #14202E;\">My competencies<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 10px;\">\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">Required vs attained<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">Gap diagnostics<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">My learning path<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0;\">Passbook<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 18px 18px;\">\n          <div style=\"font: 500 15px/1.3 Spectral, Georgia, serif; color: #14202E;\">Discover<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 10px;\">\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">Semantic search<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">By competency<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">Knowledge &amp; policies<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0;\">QR / dial-code<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 18px 18px;\">\n          <div style=\"font: 500 15px/1.3 Spectral, Georgia, serif; color: #14202E;\">Assess<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 10px;\">\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">Adaptive tests<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">Proctored exams<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0; border-bottom: 1px solid #F2EFE7;\">Certificates &amp; badges<\u002Fdiv>\n            <div style=\"font: 400 13px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 6px 0;\">Evidence record<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Interaction model<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Grounded, citable answers<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Every AI response carries issuing authority, source link, version and effective date, so a learner can verify guidance against the original circular or rule.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Human in the loop<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Generated content and assessments enter a formal two-level review before publication. Critical governance workflows always surface a human decision point.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Multilingual and multimodal<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Text, audio, image and video across Indic languages, with voice input for co-pilot interactions and automated subtitling on media.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Offline and low-bandwidth<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Mobile apps support offline access and in-app upgrades; graceful degradation is an engineering principle, not an edge case.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ tbd }}\">\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 18px 20px; margin: 26px 0 0;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #8C3A2B;\">Open · design workstream<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Screen-level wireframes and hi-fi designs, the iGOT 2.0 design system, accessibility conformance target, and the co-pilot embedding pattern agreed with each external platform owner. The scope document defines modalities and use cases but no screens; these are produced once the first-module use cases are prioritised in Phase 0.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 7 · SOLUTION ARCHITECTURE -->\n    <sc-if value=\"{{ s7 }}\">\n    <article data-screen-label=\"07 Solution Architecture\" style=\"max-width: 1120px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 07<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">Solution Architecture<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">A layered, integrated AI architecture with a centralised AI core powering all use cases, embedded across the existing platform rather than bolted alongside it.<\u002Fp>\n\n      <div data-om-raster=\"\" style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 30px 30px 34px; margin: 40px 0 0;\">\n\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #8C3A2B;\">User Experience Layer<\u002Fdiv>\n          <div style=\"flex: 1; height: 1px; background: #E8E4DA;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin: 14px 0 0;\">\n          <div style=\"background: #F7F4ED; border: 1px solid #E2DED6; border-top: 3px solid #8C3A2B; padding: 16px 16px;\">\n            <div style=\"font: 500 15px/1.25 Spectral, Georgia, serif; color: #14202E;\">Learner Portal &amp; Mobile<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Personalised home · AI-CBP paths · AI Tutor · passbook<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #F7F4ED; border: 1px solid #E2DED6; border-top: 3px solid #8C3A2B; padding: 16px 16px;\">\n            <div style=\"font: 500 15px/1.25 Spectral, Georgia, serif; color: #14202E;\">Embedded Co-pilots<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">e-HRMS · SPARROW · NIC mail · eOffice · Ask iGOT · AI Sarthi<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #F7F4ED; border: 1px solid #E2DED6; border-top: 3px solid #8C3A2B; padding: 16px 16px;\">\n            <div style=\"font: 500 15px/1.25 Spectral, Georgia, serif; color: #14202E;\">Content Management Platform<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Authoring · tagging · translation · quality · health cards<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; justify-content: center; padding: 14px 0 12px;\">\n          <div style=\"font: 500 11.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #93A1B2;\">Governed APIs ↑↓<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E;\">AI Core Layer · unified intelligence backbone<\u002Fdiv>\n          <div style=\"flex: 1; height: 1px; background: #E8E4DA;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #12233D; padding: 18px; margin: 14px 0 0;\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px;\">\n            <div style=\"background: #1B3252; border: 1px solid #2D4A72; padding: 16px 15px;\">\n              <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #FFFFFF;\">LLM &amp; Model Orchestration<\u002Fdiv>\n              <div style=\"font: 400 12px/1.5 'Instrument Sans', sans-serif; color: #A8BCD6; margin-top: 7px;\">Routes each request to the most appropriate model by use case, language, complexity, sensitivity, latency, availability, performance and cost.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #1B3252; border: 1px solid #2D4A72; padding: 16px 15px;\">\n              <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #FFFFFF;\">Vector Search &amp; RAG<\u002Fdiv>\n              <div style=\"font: 400 12px/1.5 'Instrument Sans', sans-serif; color: #A8BCD6; margin-top: 7px;\">Access-controlled enterprise retrieval — ingest, index, parse, chunk, extract metadata, enrich, embed and store vectors.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #1B3252; border: 1px solid #2D4A72; padding: 16px 15px;\">\n              <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #FFFFFF;\">Prompt, Agent &amp; Workflow Orchestration<\u002Fdiv>\n              <div style=\"font: 400 12px/1.5 'Instrument Sans', sans-serif; color: #A8BCD6; margin-top: 7px;\">Shared operational logic for AI Tutor, AI Sarthi and AI-CBP; a controlled framework for agents invoking approved services through defined tools.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #1B3252; border: 1px solid #2D4A72; padding: 16px 15px;\">\n              <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #FFFFFF;\">Governance &amp; Guardrails<\u002Fdiv>\n              <div style=\"font: 400 12px/1.5 'Instrument Sans', sans-serif; color: #A8BCD6; margin-top: 7px;\">Responsible-AI protocols, data privacy, auditability and human-in-the-loop oversight aligned with GoI AI directives.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font: 400 12px/1.5 'Instrument Sans', sans-serif; color: #7F95B4; margin-top: 14px;\">Model-agnostic · knowledge-aware · workflow-oriented · governance by design. Abstracts open-source, open-weight, sovereign, domain-specific and specialised models so any can be upgraded or substituted without changing consuming applications.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; justify-content: center; padding: 14px 0 12px;\">\n          <div style=\"font: 500 11.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #93A1B2;\">Context &amp; retrieval ↑↓<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #1F5C4A;\">Data Layer · enterprise knowledge foundation<\u002Fdiv>\n          <div style=\"flex: 1; height: 1px; background: #E8E4DA;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 14px 0 0;\">\n          <div style=\"background: #F2F6F3; border: 1px solid #D6E2DA; padding: 16px 15px;\">\n            <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #14202E;\">Governance knowledge<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Acts, rules, policies, circulars, notifications, scheme guidelines, manuals, SOPs, departmental knowledge<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #F2F6F3; border: 1px solid #D6E2DA; padding: 16px 15px;\">\n            <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #14202E;\">Learning corpus<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Existing iGOT content, courses, transcripts, assessments, case studies, simulations<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #F2F6F3; border: 1px solid #D6E2DA; padding: 16px 15px;\">\n            <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #14202E;\">Competency &amp; context graph<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">KCM functional, behavioural and domain competencies mapped to roles, tasks and schemes<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #F2F6F3; border: 1px solid #D6E2DA; padding: 16px 15px;\">\n            <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #14202E;\">Permissioned learner &amp; MDO context<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Secure, permission-controlled profile — never added indiscriminately to the common vector repository<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; justify-content: center; padding: 14px 0 12px;\">\n          <div style=\"font: 500 11.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #93A1B2;\">Stable, documented APIs &amp; data contracts ↑↓<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #6B7785;\">Modernised Sunbird Core &amp; Custom Services<\u002Fdiv>\n          <div style=\"flex: 1; height: 1px; background: #E8E4DA;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin: 14px 0 0;\">\n          <div style=\"background: #F7F4ED; border: 1px solid #E2DED6; padding: 16px 15px;\">\n            <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #14202E;\">Sunbird building blocks<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Lern · Knwlg · Obsrv — upgraded from 4th gen to latest stable (7, 8 or Spark)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #F7F4ED; border: 1px solid #E2DED6; padding: 16px 15px;\">\n            <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #14202E;\">Custom iGOT services<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Assessment engine · community hub · discussion forum · notifications · dashboards · marketplace · CBP, MDO and SPV portals<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #F7F4ED; border: 1px solid #E2DED6; padding: 16px 15px;\">\n            <div style=\"font: 500 14.5px/1.25 Spectral, Georgia, serif; color: #14202E;\">Enterprise services<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Service wrappers &amp; API management · event hub &amp; UI proxies · Keycloak identity · cross-government integration frameworks<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font: 400 12px/1.5 'Instrument Sans', sans-serif; color: #8A93A0; margin-top: 22px; border-top: 1px solid #F0ECE3; padding-top: 14px;\">Indicative representation, redrawn from the scope document. Cloud-agnostic and deployable across approved public, government or private cloud and on-premises infrastructure. Containerised services, infrastructure-as-code, and portable data and model layers enable deployment without major redesign.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Non-functional posture<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Scale &amp; reliability<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Enterprise-grade scalability for peak national demand; AI layer optimised for high concurrency and TPS. High availability, observability and resilient failover. Operational preparedness for high-volume events such as National Learning Week.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Security &amp; privacy<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Advanced security architecture for AI and LLM deployments. Sensitive government data and workflows processed only within approved, controlled environments, in compliance with data-localisation, privacy and public-sector governance requirements.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Unit economics<\u002Fdiv>\n          <p style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Cost optimised through intelligent model routing, smaller task-specific models, caching, batch processing, autoscaling and efficient vector retrieval, with continuous tracking and analysis of cloud cost data.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ tbd }}\">\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 18px 20px; margin: 26px 0 0;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #8C3A2B;\">Open · Phase 0 deliverable<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">Target-state architecture, the chosen Sunbird target version (7, 8 or Spark), deployment topology, technology selections per layer, and quantified non-functional targets — concurrency, TPS, latency and availability. All follow the current-state assessment and gap analysis.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 8 · INTEGRATION & DATA -->\n    <sc-if value=\"{{ s8 }}\">\n    <article data-screen-label=\"08 Integration and Data\" style=\"max-width: 1020px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 08<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">Integration &amp; Data<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">Knowledge ingestion is treated as an ongoing platform capability, not a one-time activity per AI use case. One shared pipeline serves semantic search, personalisation, assessment and content creation through governed APIs.<\u002Fp>\n\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 44px 0 0;\">Continuous knowledge-ingestion &amp; RAG pipeline<\u002Fh2>\n      <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; margin: 18px 0 0;\">\n        <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 18px; padding: 16px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 15px/1.4 Spectral, Georgia, serif; color: #C9B68B;\">1<\u002Fdiv><div><div style=\"font: 500 14.5px/1.4 'Instrument Sans', sans-serif; color: #14202E;\">Continuous source onboarding<\u002Fdiv><div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 4px;\">Approved government and learning sources onboarded on an ongoing basis.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 18px; padding: 16px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 15px/1.4 Spectral, Georgia, serif; color: #C9B68B;\">2<\u002Fdiv><div><div style=\"font: 500 14.5px/1.4 'Instrument Sans', sans-serif; color: #14202E;\">Automated ingestion<\u002Fdiv><div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 4px;\">APIs, repository connectors, controlled uploads and scheduled batches. Event-based pipelines detect documents or courses added, revised, withdrawn or replaced.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 18px; padding: 16px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 15px/1.4 Spectral, Georgia, serif; color: #C9B68B;\">3<\u002Fdiv><div><div style=\"font: 500 14.5px/1.4 'Instrument Sans', sans-serif; color: #14202E;\">Validation and governance<\u002Fdiv><div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 4px;\">Authority, completeness, de-duplication, security, licensing and quality checks. Original source and ownership remain identifiable throughout the lifecycle.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 18px; padding: 16px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 15px/1.4 Spectral, Georgia, serif; color: #C9B68B;\">4<\u002Fdiv><div><div style=\"font: 500 14.5px/1.4 'Instrument Sans', sans-serif; color: #14202E;\">Processing and enrichment<\u002Fdiv><div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 4px;\">OCR, text extraction, transcription, language detection, approved translation, structural parsing and metadata enrichment.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 18px; padding: 16px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 15px/1.4 Spectral, Georgia, serif; color: #C9B68B;\">5<\u002Fdiv><div><div style=\"font: 500 14.5px/1.4 'Instrument Sans', sans-serif; color: #14202E;\">Chunking and vectorisation<\u002Fdiv><div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 4px;\">Acts and rules section-wise, circulars paragraph-wise, manuals chapter-wise, FAQs as question-answer units, courses into modules, transcripts and assessments. Embeddings stored in a vector database with role, task, competency, scheme and course relationships.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 18px; padding: 16px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 15px/1.4 Spectral, Georgia, serif; color: #C9B68B;\">6<\u002Fdiv><div><div style=\"font: 500 14.5px/1.4 'Instrument Sans', sans-serif; color: #14202E;\">Multiple retrieval indexes<\u002Fdiv><div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 4px;\">Vector and semantic indexes, keyword and full-text indexes, competency and context graphs, course and assessment indexes, and authority, date, language and access-control filters.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 18px; padding: 16px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 15px/1.4 Spectral, Georgia, serif; color: #C9B68B;\">7<\u002Fdiv><div><div style=\"font: 500 14.5px/1.4 'Instrument Sans', sans-serif; color: #14202E;\">Common RAG services<\u002Fdiv><div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 4px;\">A reusable layer for query understanding, access-controlled retrieval, re-ranking, source assembly, citation generation and confidence scoring.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 18px; padding: 16px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 15px/1.4 Spectral, Georgia, serif; color: #C9B68B;\">8<\u002Fdiv><div><div style=\"font: 500 14.5px/1.4 'Instrument Sans', sans-serif; color: #14202E;\">Availability across use cases<\u002Fdiv><div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 4px;\">Indexed knowledge exposed through common APIs and services to multiple AI use cases.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 18px; padding: 16px 22px; border-bottom: 1px solid #F0ECE3;\"><div style=\"font: 500 15px/1.4 Spectral, Georgia, serif; color: #C9B68B;\">9<\u002Fdiv><div><div style=\"font: 500 14.5px/1.4 'Instrument Sans', sans-serif; color: #14202E;\">Continuous updating and re-indexing<\u002Fdiv><div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 4px;\">When a policy, course, competency or artefact changes, content is reprocessed and re-indexed. Superseded content is archived or removed from active retrieval so AI products do not provide outdated information.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 18px; padding: 16px 22px;\"><div style=\"font: 500 15px/1.4 Spectral, Georgia, serif; color: #C9B68B;\">10<\u002Fdiv><div><div style=\"font: 500 14.5px/1.4 'Instrument Sans', sans-serif; color: #14202E;\">Monitoring and improvement<\u002Fdiv><div style=\"font: 400 13.5px/1.6 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 4px;\">Ingestion failures, document freshness, metadata quality, retrieval performance, unanswered questions, citations used, learner feedback and access violations — signals that improve the shared pipeline and benefit every connected use case.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">External systems in scope<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Work-context platforms · co-pilot targets<\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;\">\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">e-HRMS<\u002Fspan>\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">SPARROW<\u002Fspan>\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">NIC mail<\u002Fspan>\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">eOffice<\u002Fspan>\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">File management systems<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 20px 22px;\">\n          <div style=\"font: 600 11px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Ecosystem &amp; standards<\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;\">\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">KarmaQuest<\u002Fspan>\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">CIOS Marketplace<\u002Fspan>\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">LTI compliance<\u002Fspan>\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">Keycloak SSO<\u002Fspan>\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">Digital locker<\u002Fspan>\n            <span style=\"font: 500 12.5px/1 'Instrument Sans', sans-serif; color: #14202E; background: #F1EDE3; border: 1px solid #E2DED6; padding: 8px 11px;\">QR / dial-code<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Standard metadata on every resource<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 32px; margin: 18px 0 0;\">\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">Title, description, content type<\u002Fdiv>\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">Issuing ministry, department or authority<\u002Fdiv>\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">Source URL and document number<\u002Fdiv>\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">Domain, function, target role<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">Competency category, ID, sub-theme, proficiency level<\u002Fdiv>\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">Primary and secondary competency mapping<\u002Fdiv>\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">Issue date, effective date, version status<\u002Fdiv>\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">Language, jurisdiction, target learner group<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">Public, internal, confidential or restricted classification<\u002Fdiv>\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">PII, sensitivity, IP / copyright and reuse-rights status<\u002Fdiv>\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">Document, parent, chunk and review identifiers<\u002Fdiv>\n          <div style=\"font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 10px 0; border-bottom: 1px solid #E8E4DA;\">All MDOs follow this standard structure<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font: 400 14px/1.7 'Instrument Sans', sans-serif; color: #4A5665; margin: 22px 0 0; max-width: 820px;\">Numerical datasets remain in structured databases or governed APIs. Their schemas, indicator definitions and methodology may be vectorised, while current figures are retrieved directly from the structured source. Historical data migration and reconciliation is carried out if required.<\u002Fp>\n\n      <sc-if value=\"{{ tbd }}\">\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 18px 20px; margin: 26px 0 0;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #8C3A2B;\">Open · dependent on KB<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">The definitive source inventory, data-sharing agreements with each ministry, integration and dependency maps for third-party libraries and external services, and the API contract for each co-pilot host platform. Phase 0 includes engaging data sources to set pipelines up.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 9 · AI / ANALYTICS / PERSONALISATION -->\n    <sc-if value=\"{{ s9 }}\">\n    <article data-screen-label=\"09 AI Analytics Personalisation\" style=\"max-width: 1020px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 09<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">AI, Analytics &amp; Personalisation<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">The intelligence layer combines governance knowledge with the permitted context of individual learners and their departments, so the platform understands not merely what a learner has studied, but what they are responsible for and what capabilities are required next.<\u002Fp>\n\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 44px 0 0;\">What feeds a recommendation<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; border-top: 3px solid #2B4C7E; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Learner context<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 11px;\">\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Profile, role, designation, MDO<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Assigned functions, required competencies<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Learning and course-completion history<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Assessment attempts, scores, capability gaps<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Certifications, badges, specialisations<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0;\">Grade or cadre, language, stated goals<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; border-top: 3px solid #1F5C4A; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Departmental context<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 11px;\">\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Work-allocation orders<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Schemes and strategic priorities<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Ongoing projects, capability gaps<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Annual plans and reports<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Capacity Building Plans<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0;\">Emerging policy requirements<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; border-top: 3px solid #8C3A2B; padding: 20px 22px;\">\n          <div style=\"font: 500 16px/1.3 Spectral, Georgia, serif; color: #14202E;\">Knowledge &amp; content<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; margin-top: 11px;\">\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Courses and learning resources<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Policies, rules, OMs, SOPs<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">KCM functional &amp; behavioural mapping<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Domain competencies from CBPs<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Primary and secondary competency labels<\u002Fdiv>\n            <div style=\"font: 400 13.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; padding: 7px 0;\">Case studies, simulations, assessments<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #F2F6F3; border: 1px solid #D6E2DA; padding: 18px 20px; margin: 16px 0 0;\">\n        <p style=\"font: 400 14px/1.65 'Instrument Sans', sans-serif; color: #2F4A3E; margin: 0;\"><strong style=\"font-weight: 600;\">Privacy boundary.<\u002Fstrong> User-level information is maintained in a secure, permission-controlled profile rather than being indiscriminately added to the common vector repository. Its use follows privacy-by-design, purpose limitation, consent and role-based access. All personal and departmental data is purpose-limited, access-controlled and used on a minimum-necessary basis.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Model strategy<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin: 18px 0 0;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 22px 24px;\">\n          <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">A governance SLM, over time<\u002Fdiv>\n          <p style=\"font: 400 14px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">iGOT 2.0 undertakes a long-term journey to develop an open-weight model into a multilingual, domain-specialised small language model for governance and public-sector capacity building, learning progressively from a curated corpus of training material, case studies, simulations, assessments and authoritative government knowledge.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 22px 24px;\">\n          <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">Training versus retrieval<\u002Fdiv>\n          <p style=\"font: 400 14px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">Not every artefact modifies model weights. Stable, validated and appropriately licensed datasets may support domain-adaptive training and fine-tuning, while current government documents and dynamic learner or departmental context are normally accessed through governed RAG, vector search and competency or context-graph services.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 22px 24px;\">\n          <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">Multi-model gateway<\u002Fdiv>\n          <p style=\"font: 400 14px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">Open standards, interoperable APIs and a multi-model gateway allow models to be selected or replaced on accuracy, security, Indic language support, latency and cost — without dependence on any single model or technology provider.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E2DED6; padding: 22px 24px;\">\n          <div style=\"font: 500 17px/1.3 Spectral, Georgia, serif; color: #14202E;\">Multimodal<\u002Fdiv>\n          <p style=\"font: 400 14px/1.65 'Instrument Sans', sans-serif; color: #4A5665; margin: 10px 0 0;\">Processing and generation across text, audio, images and video. The most appropriate model is selected per use case on performance, language support, data sensitivity, security, scalability and cost.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height: 1px; background: #E2DED6; margin: 48px 0 0;\"><\u002Fdiv>\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 30px 0 0;\">Analytics &amp; decision support<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 0 40px; margin: 18px 0 0;\">\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"font: 400 14.5px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Data-driven decision support for ministries, states and leadership<\u002Fdiv>\n          <div style=\"font: 400 14.5px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Governance dashboards and analytics reporting on the modernised Obsrv stack<\u002Fdiv>\n          <div style=\"font: 400 14.5px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Full-level telemetry: who, what, where, using what, in relation to what<\u002Fdiv>\n          <div style=\"font: 400 14.5px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Content health monitoring, including multilingual user feedback analysis<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"font: 400 14.5px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Competency gap analysis and training demand forecasting<\u002Fdiv>\n          <div style=\"font: 400 14.5px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Institutional capability planning across MDOs<\u002Fdiv>\n          <div style=\"font: 400 14.5px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Cost per AI interaction and cost per active learner as core product metrics<\u002Fdiv>\n          <div style=\"font: 400 14.5px/1.5 'Instrument Sans', sans-serif; color: #3A4654; padding: 11px 0; border-bottom: 1px solid #E8E4DA;\">Bias detection, compliance oversight and retrieval-quality monitoring<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ tbd }}\">\n        <div style=\"border: 1px dashed #C4AF8C; background: #FAF6EC; padding: 18px 20px; margin: 26px 0 0;\">\n          <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #8C3A2B;\">Open · Phase 0 deliverable\n<\u002Fdiv>\n          <p style=\"font: 400 14px/1.6 'Instrument Sans', sans-serif; color: #4A5665; margin: 9px 0 0;\">The prioritised AI use-case list for the first module, the chosen model strategy per use case, evaluation assets and quality thresholds, and the cost-per-interaction target that gates national rollout.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <!-- 10 · DELIVERY PLAN & ESTIMATION -->\n    <sc-if value=\"{{ s10 }}\">\n    <article data-screen-label=\"10 Delivery Plan and Estimation\" style=\"max-width: 1180px; padding: clamp(32px, 5vw, 60px) clamp(24px, 6vw, 72px) 130px;\">\n      <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8C3A2B;\">Section 10<\u002Fdiv>\n      <h1 style=\"font: 600 44px/1.1 Spectral, Georgia, serif; letter-spacing: -0.02em; color: #14202E; margin: 14px 0 0;\">Delivery Plan &amp; Estimation<\u002Fh1>\n      <p style=\"font: 300 21px/1.55 Spectral, Georgia, serif; color: #3A4654; margin: 20px 0 0; max-width: 760px; text-wrap: pretty;\">An outcome-driven phased delivery model. Each phase carries an exit gate; the next phase does not begin until that gate is signed off.<\u002Fp>\n\n      <h2 style=\"font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #2B4C7E; margin: 44px 0 0;\">Phase-wise implementation roadmap<\u002Fh2>\n      <div data-om-raster=\"\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1px; background: #E2DED6; border: 1px solid #E2DED6; margin: 18px 0 0;\">\n\n        <div style=\"background: #FFFFFF; display: flex; flex-direction: column;\">\n          <div style=\"background: #12233D; padding: 16px 18px;\">\n            <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #C9B68B;\">Phase 0<\u002Fdiv>\n            <div style=\"font: 500 18px/1.2 Spectral, Georgia, serif; color: #FFFFFF; margin-top: 8px;\">Aug–Sep 2026<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.4 'Instrument Sans', sans-serif; color: #9DB2CD; margin-top: 4px;\">Mobilise &amp; align<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 18px 18px; flex: 1;\">\n            <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Primary focus<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; margin-top: 10px;\">\n              <div style=\"font: 400 13px/1.55 'Instrument Sans', sans-serif; color: #4A5665; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Workshop with all stakeholders — Tarento, COSS (advisory), AI agency if any — to onboard on scope and incorporate feedback<\u002Fdiv>\n              <div style=\"font: 400 13px/1.55 'Instrument Sans', sans-serif; color: #4A5665; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Align on high-level AI platform build-up: prioritised use cases, data types and sources, model strategy, milestones, resources<\u002Fdiv>\n              <div style=\"font: 400 13px/1.55 'Instrument Sans', sans-serif; color: #4A5665; padding: 7px 0; border-bottom: 1px solid #F2EFE7;\">Week-wise detailed project plan w I platform modules per milestone prioritisation<\u002Fdiv>\n              <div style=\"font: 400 13px/1.55 'Instrument Sans', sans-serif; color: #4A5665; padding: 7px 0;\">Collect feedback and fine-tune the model, weights and inputs as required<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #F7F4ED; border-top: 1px solid #E2DED6; padding: 16px 18px;\">\n            <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8C3A2B;\">Exit gate<\u002Fdiv>\n            <div style=\"font: 500 14.5px/1.35 Spectral, Georgia, serif; color: #14202E; margin-top: 7px;\">Release proven; live with all central ministries and selected states<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.5 'Instrument Sans', sans-serif; color: #5A6675; margin-top: 7px;\">Selected MDOs onboarded onto the new AI-powered experience and first AI module · migration of an agreed percentage of user traffic onto the upgraded platform<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; display: flex; flex-direction: column;\">\n          <div style=\"background: #2D5480; padding: 16px 18px;\">\n            <div style=\"font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.13em; text-transform: uppercase; color: #C9B68B;\">Phase 3<\u002Fdiv>\n            <div style=\"font: 500 18px/1.2 Spectral, Georgia, serif; color: #FFFFFF; margin-top: 8px;\">Apr–Sep 2027<\u002Fdiv>\n            <div style=\"font: 400 12.5px/1.4 'Instrument Sans', sans-serif; color: #B8C9DF; margin-top: 4px;\">Scale<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 18px 18px; flex: 1;\">\n            <div style=\"font: 600 10px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7785;\">Primary focus<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; margin-top: 10px;\">\n
