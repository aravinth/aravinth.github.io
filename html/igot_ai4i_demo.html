<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iGOT Karmayogi × AI4I Orchestrate — AI Control Plane</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F8FB}
a{color:#2563B8}a:hover{color:#1E4F94}
*{box-sizing:border-box}
button{font-family:inherit}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border:0;background:transparent;border-radius:10px;color:#1E293B;font-size:15px;font-weight:500;text-align:left;cursor:pointer;position:relative}
.nav:hover{background:#F1F5F9}
.nav.on{background:#EAF4FD;color:#0F172A;font-weight:600}
.nav.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:2px;background:#2563B8}
.nav svg{width:19px;height:19px;flex:none;color:#475569}
.navh{font-size:12px;letter-spacing:.12em;font-weight:600;color:#64748B;margin:18px 0 6px 2px}
.card{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px}
.kpi{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kl{font-size:12px;letter-spacing:.08em;font-weight:600;color:#475569;text-transform:uppercase}
.kv{font-size:34px;font-weight:700;color:#0F172A;line-height:1.15}
.ks{font-size:13px;color:#64748B}
.up{color:#15803D;font-size:14px;font-weight:500}
.sec{font-size:12px;letter-spacing:.1em;font-weight:600;color:#64748B;text-transform:uppercase;margin:4px 0 0}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.ok{background:#DCFCE7;color:#166534}
.bad{background:#FEE2E2;color:#991B1B}
.warn{background:#FEF3C7;color:#92400E}
.neu{background:#F1F5F9;color:#334155}
.blue{background:#DBEAFE;color:#1E40AF}
.t-LLM{background:#EDE9FE;color:#5B21B6}
.t-ASR{background:#CCFBF1;color:#115E59}
.t-NMT{background:#DBEAFE;color:#1E40AF}
.t-TTS{background:#FEF3C7;color:#92400E}
.t-PII{background:#FCE7F3;color:#9D174D}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#2563B8;color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#1E4F94}
.btn2{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #E2E8F0;background:#FFFFFF;color:#0F172A;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.fld{display:flex;flex-direction:column;gap:6px;min-width:180px;flex:1 1 180px;max-width:340px}
.fld label{font-size:14px;font-weight:600;color:#0F172A}
.in{height:44px;border:1px solid #CBD5E1;border-radius:9px;padding:0 12px;font-size:15px;font-family:inherit;color:#0F172A;background:#FFFFFF;width:100%}
.seg{display:inline-flex;background:#F1F5F9;border:1px solid #E2E8F0;border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:38px;padding:0 16px;border-radius:8px;font-size:15px;color:#334155;cursor:pointer}
.seg button.on{background:#FFFFFF;color:#0F172A;font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.08)}
.rng{display:inline-flex;border:1px solid #E2E8F0;border-radius:999px;overflow:hidden;background:#FFFFFF}
.rng button{border:0;background:transparent;min-height:42px;padding:0 18px;font-size:15px;color:#0F172A;cursor:pointer;border-right:1px solid #E2E8F0}
.rng button:last-child{border-right:0}
.rng button.on{background:#B4552A;color:#FFFFFF}
.tabs{display:flex;gap:28px;border-bottom:1px solid #E2E8F0;flex-wrap:wrap}
.tabs button{border:0;background:transparent;min-height:46px;padding:0 4px;font-size:17px;color:#1E293B;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:#2563B8;border-bottom-color:#2563B8;font-weight:500}
.tbox{border:1px solid #E2E8F0;border-radius:14px;background:#FFFFFF;overflow-x:auto}
.tr{display:grid;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid #EEF2F6;font-size:15px;color:#0F172A;min-width:980px}
.th{background:#F8FAFC;font-size:12px;letter-spacing:.07em;font-weight:600;color:#475569;text-transform:uppercase;padding:14px 20px}
.tf{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:#F8FAFC;font-size:14px;color:#334155;flex-wrap:wrap;min-width:980px}
.mono{font-family:'JetBrains Mono',monospace;font-size:14px}
.mut{color:#64748B;font-size:13px}
.ico{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:8px;color:#334155;cursor:pointer}
.ico:hover{background:#F1F5F9}
.ico svg{width:18px;height:18px}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:13px;font-weight:700;flex:none}
.bar{height:8px;border-radius:999px;background:#EEF2F6;overflow:hidden}
.bar > div{height:100%;border-radius:999px}
.g-logs{grid-template-columns:1.3fr .8fr .6fr 1.3fr 1.6fr 1.2fr .6fr .3fr}
.g-mod{grid-template-columns:1.5fr .6fr 1fr .7fr .9fr .8fr .8fr .2fr}
.g-svc{grid-template-columns:1.6fr .6fr 1.8fr 1.1fr .8fr .8fr .9fr}
.g-inst{grid-template-columns:2.2fr 1.2fr 1.1fr .7fr 1.2fr 1fr .7fr}
.g-key{grid-template-columns:1.6fr 1.2fr 1.3fr 1.1fr .7fr .8fr .8fr 1fr}
.g-not{grid-template-columns:2.4fr 1.3fr 1.2fr 1fr}
.g-tier{grid-template-columns:1.4fr .8fr 1.3fr .7fr .8fr 1fr .8fr}
.g-pol{grid-template-columns:2fr 1.6fr 1fr .8fr .7fr .6fr}
.g-acc{grid-template-columns:1fr 2.2fr 1.4fr .8fr}
.chk{width:18px;height:18px;accent-color:#2563B8}
.sgl{display:inline-flex;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden}
.sgl button{border:0;background:#FFFFFF;min-height:36px;padding:0 12px;font-size:14px;color:#0F172A;cursor:pointer}
.sgl button.on{background:#4F8FDC;color:#FFFFFF}
.studio{position:relative;overflow:hidden;padding:24px;display:flex;flex-direction:column;gap:16px}
.try{min-height:44px;border:0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:#0F172A}
.expc{text-align:left;padding:18px 20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;font-family:inherit;color:#0F172A;min-height:44px}
.expc:hover{border-color:#93C5FD}
.expc.on{border-color:#2563B8;box-shadow:0 0 0 3px #DBEAFE}
.va{background:#CCFBF1;color:#115E59}
.vb{background:#EDE9FE;color:#5B21B6}
.dn{color:#B91C1C;font-size:14px;font-weight:500}
.rngin{width:100%;height:44px;accent-color:#7C3AED;cursor:pointer}
.g-cmp{grid-template-columns:1.3fr 1.4fr 1.4fr .9fr .6fr}
.g-scen{grid-template-columns:1.4fr 1fr .8fr 1fr 1.1fr}
.g-seg{grid-template-columns:1.2fr .8fr .8fr .8fr .8fr}
.tr.cur{background:#EFF6FF}
.gd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #EEF2F6;font-size:15px}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A; background: #F6F8FB">

<!-- SIDEBAR -->
<nav aria-label="Main" style="flex: 1 1 260px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #E2E8F0; padding: 0 12px 24px 24px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 10px; padding: 20px 0 18px; border-bottom: 1px solid #EEF2F6; margin: 0 0 6px -12px; padding-left: 12px">
    <div style="display: flex; flex-direction: column; align-items: center; line-height: 1">
      <span style="background: #4B5563; color: #FFFFFF; font-weight: 800; font-size: 15px; padding: 3px 5px; border-radius: 3px; letter-spacing: .02em">AI4</span>
      <span style="font-size: 7px; font-weight: 800; letter-spacing: .06em; margin-top: 2px; color: #1F2937">INCLUSION</span>
    </div>
    <span aria-hidden="true" style="color: #94A3B8; font-size: 14px">×</span>
    <div style="display: flex; flex-direction: column; line-height: 1.15">
      <span style="font-size: 15px; font-weight: 800; color: #B4552A">iGOT Karmayogi</span>
      <span style="font-size: 11px; font-weight: 500; color: #475569">AI Control Plane</span>
    </div>
  </div>

  <p class="navh">TRY</p>
  <button class="nav {{nav.explore}}" onClick="{{go.explore}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg><span>Karmayogi AI Studio</span></button>

  <p class="navh">MONITOR</p>
  <button class="nav {{nav.usage}}" onClick="{{go.usage}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M9.5 20V8M14 20V4M18.5 20v-9"></path></svg><span>Usage Dashboard</span></button>
  <button class="nav {{nav.logs}}" onClick="{{go.logs}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4M9 12h6M9 16h6"></path></svg><span>Logs Dashboard</span></button>
  <button class="nav {{nav.pilot}}" onClick="{{go.pilot}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg><span>Pilot Tracker</span><span class="pill warn" style="margin-left: auto; font-size: 11px">WK 7</span></button>

  <p class="navh">MANAGE</p>
  <button class="nav {{nav.models}}" onClick="{{go.models}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7" ry="2.5"></ellipse><path d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"></path></svg><span>Model Management</span></button>
  <button class="nav {{nav.services}}" onClick="{{go.services}}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="6" r="1.6"></circle><circle cx="12" cy="6" r="1.6"></circle><circle cx="18" cy="6" r="1.6"></circle><circle cx="6" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18" cy="12" r="1.6"></circle><circle cx="6" cy="18" r="1.6"></circle><circle cx="12" cy="18" r="1.6"></circle><circle cx="18" cy="18" r="1.6"></circle></svg><span>Services Management</span></button>
  <button class="nav {{nav.depts}}" onClick="{{go.depts}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V10M19 21V10M9.5 21V10M14.5 21V10M3 10l9-6 9 6z"></path></svg><span>Department Management</span></button>
  <button class="nav {{nav.keys}}" onClick="{{go.keys}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15" cy="9" r="5"></circle><path d="M11.5 12.5L4 20v-3h2v-2h2l1.5-1.5"></path></svg><span>API Key Management</span></button>
  <button class="nav {{nav.settings}}" onClick="{{go.settings}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"></path><path d="M10 20a2 2 0 004 0"></path></svg><span>Platform Settings</span></button>
  <button class="nav {{nav.tiers}}" onClick="{{go.tiers}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="7.5" r="1.2"></circle></svg><span>Tier Management</span></button>

  <p class="navh">ORCHESTRATION</p>
  <button class="nav {{nav.policy}}" onClick="{{go.policy}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg><span>Policy Management</span></button>

  <p class="navh">EXPERIMENTS</p>
  <button class="nav {{nav.ab}}" onClick="{{go.ab}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 001.3 2h12.4a1.5 1.5 0 001.3-2L14 9V3"></path><path d="M7 15h10"></path></svg><span>A/B Testing</span><span class="pill vb" style="margin-left: auto; font-size: 11px">2 LIVE</span></button>

  <div style="margin-top: auto; padding-top: 28px">
    <div style="border: 1px solid #E2E8F0; border-radius: 12px; padding: 14px; display: flex; gap: 10px; align-items: center">
      <span class="av" style="background: #B4552A">KB</span>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 14px; font-weight: 600">Adopter Admin</span>
        <span class="mut">Karmayogi Bharat</span>
      </div>
    </div>
  </div>
</nav>

<!-- MAIN -->
<main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px">
<div class="card" style="padding: 28px 32px 36px; max-width: 1480px; margin: 0 auto">

<!-- ================= EXPLORE ================= -->
<sc-if value="{{is.explore}}" hint-placeholder-val="{{ false }}">
  <div style="display: flex; flex-direction: column; gap: 24px">
    <div>
      <p class="mut" style="margin: 0 0 8px; font-size: 15px">Usage Dashboard  ›  <span style="color: #0F172A; font-weight: 500">Karmayogi AI Studio</span></p>
      <h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em">Karmayogi AI Studio</h1>
      <p style="margin: 8px 0 0; color: #475569; font-size: 17px">Test the models behind iGOT's AI services before you route a department's traffic to them.</p>
    </div>
    <div style="height: 1px; background: #E2E8F0"></div>
    <div class="g3">
      <sc-for list="{{studio}}" as="s" hint-placeholder-count="6">
        <div class="card studio" style="border-top: 3px solid {{s.color}}">
          <div style="display: flex; gap: 16px; align-items: flex-start">
            <span style="width: 56px; height: 56px; border-radius: 12px; background: {{s.tint}}; color: {{s.color}}; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex: none">{{s.abbr}}</span>
            <div style="flex: 1; min-width: 0">
              <h2 style="margin: 0; font-size: 19px; font-weight: 700">{{s.name}}</h2>
              <p class="mut" style="margin: 4px 0 0">Powers {{s.powers}}</p>
            </div>
            <span class="pill t-{{s.task}}">{{s.task}}</span>
          </div>
          <p style="margin: 0; color: #334155; font-size: 15px; line-height: 1.55">{{s.desc}}</p>
          <button class="try" style="background: {{s.tint}}" onClick="{{s.pick}}">Try it now →</button>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{tryOpen}}" hint-placeholder-val="{{ false }}">
      <section class="card" aria-label="Playground" style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
          <h2 style="margin: 0; font-size: 20px">Playground · {{tryCard.name}}</h2>
          <span class="mut">Routed through AI4I Orchestrate · metered to <b style="color: #0F172A">Karmayogi Bharat / Studio</b></span>
        </div>
        <div style="display: flex; gap: 14px; flex-wrap: wrap">
          <div class="fld"><label for="pg-model">Model</label><select id="pg-model" class="in"><option>{{tryCard.model}}</option></select></div>
          <div class="fld"><label for="pg-lang">Language</label><select id="pg-lang" class="in"><option>{{tryCard.lang}}</option></select></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
          <div class="fld" style="max-width: none"><label for="pg-in">Input</label><textarea id="pg-in" class="in" style="height: 130px; padding: 12px; line-height: 1.5; resize: vertical">{{tryCard.input}}</textarea></div>
          <div class="fld" style="max-width: none"><span style="font-size: 14px; font-weight: 600">Output</span><div style="min-height: 130px; border: 1px solid #E2E8F0; border-radius: 9px; padding: 12px; background: #F8FAFC; font-size: 15px; line-height: 1.6; white-space: pre-line">{{tryCard.output}}</div></div>
        </div>
        <div style="display: flex; gap: 18px; flex-wrap: wrap; align-items: center">
          <button class="btn">Run</button>
          <span class="mut">Latency {{tryCard.lat}} · Cost {{tryCard.cost}} · Trace <span class="mono">{{tryCard.trace}}</span></span>
        </div>
      </section>
    </sc-if>
  </div>
</sc-if>

<!-- ================= USAGE ================= -->
<sc-if value="{{is.usage}}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start">
      <div>
        <h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em">Usage Dashboard</h1>
        <p style="margin: 8px 0 0; color: #475569; font-size: 17px">Monitor AI consumption and spend across ministries, departments and iGOT applications.</p>
      </div>
      <span class="pill neu">Demo data</span>
    </div>
    <div style="height: 1px; background: #E2E8F0"></div>
    <div>
      <h2 style="margin: 0; font-size: 20px">Key metrics</h2>
      <p class="mut" style="margin: 4px 0 0; font-size: 14px">Platform-wide department, model and spend indicators</p>
    </div>
    <p class="sec">Department metrics</p>
    <div class="g4">
      <div class="kpi"><span class="kl">Total departments</span><span class="kv">10</span><span class="ks">Ministries, states and bodies onboarded</span></div>
      <div class="kpi"><span class="kl">Active departments</span><span class="kv">8</span><span class="ks">In the last 30 days</span></div>
      <div class="kpi"><span class="kl">New departments</span><span class="kv">2</span><span class="ks">In the last 15 days · Govt of Odisha, MoRD</span></div>
      <div class="kpi"><span class="kl">Budget exhausted</span><span class="kv" style="color: #B91C1C">1</span><span class="ks">Ministry of Railways</span></div>
    </div>
    <p class="sec">Model &amp; spend metrics</p>
    <div class="g4">
      <div class="kpi"><span class="kl">Total models</span><span class="kv">11</span><span class="ks">LLM · ASR · NMT · TTS · PII</span></div>
      <div class="kpi"><span class="kl">Active models</span><span class="kv">9</span><span class="ks">In the last 30 days</span></div>
      <div class="kpi"><span class="kl">Spend this month</span><span class="kv">₹19.4 L</span><span class="ks">of ₹39 L allocated · 50%</span></div>
      <div class="kpi"><span class="kl">Cost per 1K requests</span><span class="kv">₹41.8</span><span class="up">↓ 12.4% vs previous 30</span></div>
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 6px">
      <div class="rng" role="group" aria-label="Time range">
        <button class="{{rng.today}}" onClick="{{setRng.today}}">Today</button>
        <button class="{{rng.yday}}" onClick="{{setRng.yday}}">Yesterday</button>
        <button class="{{rng.d7}}" onClick="{{setRng.d7}}">Last 7 days</button>
        <button class="{{rng.d30}}" onClick="{{setRng.d30}}">Last 30 days</button>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center">
      <div style="display: flex; gap: 14px; flex-wrap: wrap; align-items: center">
        <select class="in" aria-label="Department" style="width: 280px; border-color: #0F172A"><option>All departments</option><option>DoPT</option><option>MoAFW</option><option>Govt of Odisha</option></select>
        <div class="seg" role="group" aria-label="Breakdown">
          <button class="{{dt.dept}}" onClick="{{setDt.dept}}">Department</button>
          <button class="{{dt.model}}" onClick="{{setDt.model}}">Model</button>
          <button class="{{dt.budget}}" onClick="{{setDt.budget}}">Budget</button>
          <button class="{{dt.app}}" onClick="{{setDt.app}}">Applications</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">

<sc-if value="{{is.ab}}" hint-placeholder-val="{{ false }}">

        <p style="margin: 8px 0 0; color: #475569; font-size: 17px">Route a share of live traffic to a challenger model and see how cost and accuracy move before you switch.</p>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap"><button class="btn2">Experiment history</button><button class="btn">＋ New Experiment</button></div>
    </div>

          <span style="font-size: 17px; font-weight: 700">{{e.name}}</span>
          <span class="mut" style="font-size: 14px">{{e.service}} · {{e.short}}</span>
        </button>
      </sc-for>
    </div>

    <section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start">
        <div style="min-width: 0; flex: 1 1 420px">
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><span class="pill {{ab.tone}}">{{ab.status}}</span><span class="mut">Day {{ab.day}} of {{ab.days}}</span></div>
          <h2 style="margin: 8px 0 0; font-size: 24px">{{ab.name}}</h2>
          <p style="margin: 8px 0 0; color: #334155; font-size: 15px; line-height: 1.55"><b>Hypothesis:</b> {{ab.hyp}}</p>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap"><button class="btn2">Pause</button><button class="btn2">Roll back to A</button><button class="btn" style="background: #6D28D9">Promote B to 100%</button></div>
      </div>
      <div class="bar" style="height: 6px"><div style="width: {{ab.dayPct}}%; background: #2563B8"></div></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 24px">
        <div><span class="kl">Service · app</span><div style="font-size: 15px; margin-top: 4px">{{ab.service}} · {{ab.app}}</div></div>
        <div><span class="kl">Primary metric</span><div style="font-size: 15px; margin-top: 4px">{{ab.metric}}</div></div>
        <div><span class="kl">Routing rule</span><div style="font-size: 15px; margin-top: 4px">{{ab.routing}}</div></div>
        <div><span class="kl">Departments in scope</span><div style="font-size: 15px; margin-top: 4px">{{ab.scope}}</div></div>
        <div><span class="kl">Started</span><div style="font-size: 15px; margin-top: 4px">{{ab.started}}</div></div>
        <div><span class="kl">Evaluation</span><div style="font-size: 15px; margin-top: 4px">{{ab.evalm}}</div></div>
      </div>
    </section>

    <section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center">
        <p class="sec" style="margin: 0">{{ab.routeTitle}}</p>
        <span class="mut">Volume basis: {{ab.vol}}</span>
      </div>
      <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap">
        <span style="display: flex; gap: 10px; align-items: center"><span class="pill va">A · CONTROL</span><span style="font-size: 16px; font-weight: 600">{{ab.aModel}}</span><span style="font-size: 22px; font-weight: 700">{{ab.sA}}%</span></span>
        <span style="display: flex; gap: 10px; align-items: center"><span style="font-size: 22px; font-weight: 700">{{ab.sB}}%</span><span style="font-size: 16px; font-weight: 600">{{ab.bModel}}</span><span class="pill vb">B · CHALLENGER</span></span>
      </div>
      <div style="display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: #EDE9FE" aria-hidden="true"><div style="width: {{ab.sA}}%; background: #0F8C7E"></div><div style="flex: 1; background: #7C3AED"></div></div>
      <label for="ab-split" class="mut" style="font-size: 14px">Share of traffic routed to B</label>
      <input id="ab-split" type="range" class="rngin" min="0" max="100" step="5" value="{{ab.sB}}" onChange="{{onSplit}}">
      <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center">
        <div class="seg" role="group" aria-label="Preset split">
          <sc-for list="{{presets}}" as="pr" hint-placeholder-count="6"><button class="{{pr.cls}}" onClick="{{pr.pick}}">{{pr.label}}</button></sc-for>
        </div>
        <button class="btn">Apply split</button>
      </div>
      <p class="mut" style="margin: 0">Assignment is sticky per Karmayogi ID / course video, so a learner always sees the same variant. Learner PII redaction runs before either model.</p>
    </section>

    <div class="g4">
      <div class="kpi"><span class="kl">Projected monthly cost</span><span class="kv">{{ab.cost}}</span><span class="{{ab.costCls}}">{{ab.costDelta}}</span><span class="ks">Budget {{ab.budget}}</span></div>
      <div class="kpi"><span class="kl">Blended accuracy</span><span class="kv">{{ab.acc}}</span><span class="{{ab.accCls}}">{{ab.accDelta}}</span><span class="ks">Gate {{ab.minAcc}}</span></div>
      <div class="kpi"><span class="kl">Blended p95 latency</span><span class="kv">{{ab.p95}}</span><span class="ks">Limit {{ab.maxP95}}</span></div>
      <div class="kpi"><span class="kl">Blended error rate</span><span class="kv">{{ab.err}}</span><span class="ks">Auto-rollback above {{ab.maxErr}}</span></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px">
      <section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 12px">
        <p class="sec" style="margin: 0">Cost vs accuracy across traffic split</p>
        <div style="display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; color: #334155">
          <span style="display: inline-flex; gap: 8px; align-items: center"><span style="width: 18px; height: 3px; background: #B4552A"></span>Monthly cost</span>
          <span style="display: inline-flex; gap: 8px; align-items: center"><span style="width: 18px; height: 3px; background: #2563B8"></span>Accuracy</span>
          <span style="display: inline-flex; gap: 8px; align-items: center"><span style="width: 18px; border-top: 2px dashed #64748B"></span>Accuracy gate</span>
        </div>
        <svg viewBox="0 0 600 230" role="img" aria-label="Line chart of projected monthly cost and accuracy as traffic share to B goes from 0 to 100 percent" style="width: 100%; height: auto; font-family: inherit">
          <line x1="60" y1="190" x2="540" y2="190" stroke="#CBD5E1" stroke-width="1"></line>
          <line x1="60" y1="30" x2="540" y2="30" stroke="#EEF2F6" stroke-width="1"></line>
          <line x1="60" y1="110" x2="540" y2="110" stroke="#EEF2F6" stroke-width="1"></line>
          <line x1="60" y1="{{ab.ch.thY}}" x2="540" y2="{{ab.ch.thY}}" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4"></line>
          <polyline points="{{ab.ch.costPts}}" fill="none" stroke="#B4552A" stroke-width="3"></polyline>
          <polyline points="{{ab.ch.accPts}}" fill="none" stroke="#2563B8" stroke-width="3"></polyline>
          <line x1="{{ab.ch.mx}}" y1="22" x2="{{ab.ch.mx}}" y2="190" stroke="#7C3AED" stroke-width="1.5"></line>
          <circle cx="{{ab.ch.mx}}" cy="{{ab.ch.my1}}" r="6" fill="#B4552A" stroke="#FFFFFF" stroke-width="2"></circle>
          <circle cx="{{ab.ch.mx}}" cy="{{ab.ch.my2}}" r="6" fill="#2563B8" stroke="#FFFFFF" stroke-width="2"></circle>
          <text x="54" y="34" text-anchor="end" font-size="12" fill="#B4552A">{{ab.ch.cHi}}</text>
          <text x="54" y="194" text-anchor="end" font-size="12" fill="#B4552A">{{ab.ch.cLo}}</text>
          <text x="546" y="34" font-size="12" fill="#2563B8">{{ab.ch.aHi}}</text>
          <text x="546" y="194" font-size="12" fill="#2563B8">{{ab.ch.aLo}}</text>
          <text x="60" y="214" font-size="12" fill="#475569">0% to B</text>
          <text x="300" y="214" text-anchor="middle" font-size="12" fill="#475569">50%</text>
          <text x="540" y="214" text-anchor="end" font-size="12" fill="#475569">100% to B</text>
          <text x="{{ab.ch.mx}}" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">{{ab.sB}}%</text>
        </svg>
      </section>
      <section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 12px">
        <p class="sec" style="margin: 0">Statistical significance</p>
        <div style="display: flex; gap: 8px; flex-wrap: wrap"><span class="pill {{ab.stat.sigTone}}">{{ab.stat.sigTxt}}</span></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
          <div><span class="kl">p-value</span><div class="kv" style="font-size: 26px">{{ab.stat.p}}</div></div>
          <div><span class="kl">95% CI of difference (B − A)</span><div class="kv" style="font-size: 20px">{{ab.stat.ci}}</div></div>
          <div><span class="kl">Min. detectable effect</span><div style="font-size: 17px; font-weight: 600; margin-top: 4px">{{ab.stat.mde}}</div></div>
          <div><span class="kl">Samples A · B</span><div style="font-size: 17px; font-weight: 600; margin-top: 4px">{{ab.stat.nA}} · {{ab.stat.nB}}</div></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Sample size progress (smaller arm)</span><b>{{ab.stat.prog}}% of {{ab.stat.req}}</b></div>
          <div class="bar"><div style="width: {{ab.stat.prog}}%; background: #7C3AED"></div></div>
        </div>
        <div style="border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px; background: #F8FAFC"><span class="kl">Recommendation</span><div style="margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><span class="pill {{ab.stat.vtone}}">{{ab.stat.vlabel}}</span><span style="font-size: 15px">{{ab.stat.verdict}}</span></div></div>
      </section>
    </div>

    <div>
      <p class="sec" style="margin: 0 0 12px">Variant comparison</p>
      <div class="tbox">
        <div class="tr th g-cmp"><span>Metric</span><span>A · control</span><span>B · challenger</span><span>B vs A</span><span>Better</span></div>
        <sc-for list="{{ab.cmp}}" as="c" hint-placeholder-count="10">
          <div class="tr g-cmp"><span style="font-weight: 600">{{c.label}}</span><span>{{c.a}}</span><span>{{c.b}}</span><span>{{c.d}}</span><span><span class="pill {{c.tone}}">{{c.best}}</span></span></div>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px">
      <section class="card" style="padding: 8px 24px 16px">
        <p class="sec" style="margin: 16px 0 4px">Guardrails at {{ab.sB}}% to B</p>
        <sc-for list="{{ab.guards}}" as="g" hint-placeholder-count="5">
          <div class="gd"><span>{{g.label}}</span><span style="display: flex; gap: 10px; align-items: center"><b>{{g.val}}</b><span class="pill {{g.tone}}">{{g.txt}}</span></span></div>
        </sc-for>
      </section>
      <section class="card" style="padding: 8px 24px 16px">

    var cp = [], ap = [];

    var ok = function(a, c){ return a >= E.minAcc - 1e-9 && c <= E.budget; };

      ['Monthly cost at 100%', rup(costA), rup(costB), sgn(costB - costA, 0).replace(/[0-9.]+/, function(m){ return '₹' + fmt(+m); }), better(costA, costB, false)],
      ['Cost per quality point', rup(A.cost / (A.acc * 100) * 100) + ' /100', rup(B.cost / (B.acc * 100) * 100) + ' /100', sgn(((B.cost / B.acc) / (A.cost / A.acc) - 1) * 100, 0) + '%', better(A.cost / A.acc, B.cost / B.acc, false)],
      ['Latency p50', A.p50 + ' ' + lu, B.p50 + ' ' + lu, sgn(B.p50 - A.p50, 1) + ' ' + lu, better(A.p50, B.p50, false)],
